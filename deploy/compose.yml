# Production stack: Postgres, S3-compatible storage, the Beehive server and the web app.
# Walkthrough: docs/self-hosting.md. Configuration: deploy/server.toml and deploy/.env.
#
#   cp deploy/.env.example deploy/.env      # then replace every CHANGE-ME
#   docker compose -f deploy/compose.yml build
#   docker compose -f deploy/compose.yml up -d
#   docker compose -f deploy/compose.yml --profile caddy up -d   # with TLS

name: bee

x-server-env: &server-env
  BEE_PUBLIC_URL: ${BEE_PUBLIC_URL:?set BEE_PUBLIC_URL in deploy/.env}
  BEE_POSTGRES_URL: ${BEE_POSTGRES_URL:?set BEE_POSTGRES_URL in deploy/.env}
  BEE_FORGE_DATABASE: ${BEE_FORGE_DATABASE:?set BEE_FORGE_DATABASE in deploy/.env}
  BEE_S3_ENDPOINT: ${BEE_S3_ENDPOINT:-http://s3:9000}
  BEE_S3_BUCKET: ${BEE_S3_BUCKET:-bee}
  BEE_S3_ACCESS_KEY: ${BEE_S3_ACCESS_KEY:?set BEE_S3_ACCESS_KEY in deploy/.env}
  BEE_S3_SECRET_KEY: ${BEE_S3_SECRET_KEY:?set BEE_S3_SECRET_KEY in deploy/.env}
  BEE_SIGNING_KEY_HEX: ${BEE_SIGNING_KEY_HEX:?set BEE_SIGNING_KEY_HEX in deploy/.env}
  BEE_URL_KEY_HEX: ${BEE_URL_KEY_HEX:?set BEE_URL_KEY_HEX in deploy/.env (openssl rand -hex 32)}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-bee}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object store. Any S3 service works: to use another one, delete these two
  # services and set the BEE_S3_* variables in deploy/.env.
  s3:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${BEE_S3_ACCESS_KEY:?set BEE_S3_ACCESS_KEY in deploy/.env}
      RUSTFS_SECRET_KEY: ${BEE_S3_SECRET_KEY:?set BEE_S3_SECRET_KEY in deploy/.env}
    volumes:
      - s3-data:/data

  s3-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${BEE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BEE_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      BEE_S3_ENDPOINT: ${BEE_S3_ENDPOINT:-http://s3:9000}
      BEE_S3_BUCKET: ${BEE_S3_BUCKET:-bee}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url "$$BEE_S3_ENDPOINT" s3api head-bucket --bucket "$$BEE_S3_BUCKET" 2>/dev/null \
          || aws --endpoint-url "$$BEE_S3_ENDPOINT" s3api create-bucket --bucket "$$BEE_S3_BUCKET"; do
          echo "waiting for the object store"; sleep 2
        done
        echo "bucket $$BEE_S3_BUCKET is ready"
    restart: "no"

  bee-init:
    image: ${BEE_SERVER_IMAGE:-bee-server:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["--config", "/etc/bee/server.toml", "--check-config"]
    environment: *server-env
    volumes:
      - ./server.toml:/etc/bee/server.toml:ro
    restart: "no"

  bee-server:
    image: ${BEE_SERVER_IMAGE:-bee-server:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      bee-init:
        condition: service_completed_successfully
    environment:
      <<: *server-env
      BEE_GIT_SSH_LISTEN: 0.0.0.0:2222
      BEE_GIT_SSH_HOST_KEY: /data/ssh_host_ed25519_key
    volumes:
      - ./server.toml:/etc/bee/server.toml:ro
      - bee-data:/data
    ports:
      # The API, git smart HTTP and MCP. Loopback by default: put Caddy (or your own proxy) in front
      # for public access, or set BEE_API_BIND=0.0.0.0 to publish it directly.
      - "${BEE_API_BIND:-127.0.0.1}:${BEE_API_PORT:-7420}:7420"
      - "${BEE_SSH_PORT:-2222}:2222"

  web:
    image: ${BEE_WEB_IMAGE:-bee-web:latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      bee-server:
        condition: service_healthy
    environment:
      BEE_API_URL: http://bee-server:7420
      PORT: "3100"
    ports:
      - "${BEE_WEB_PORT:-3100}:3100"

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - web
      - bee-server
    environment:
      BEE_DOMAIN: ${BEE_DOMAIN:?set BEE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${BEE_HTTP_PORT:-80}:80"
      - "${BEE_HTTPS_PORT:-443}:443"

volumes:
  postgres-data:
  s3-data:
  bee-data:
  caddy-data:
  caddy-config:
