{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bee.configMapName" . }}
  labels:
    {{- include "bee.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  server.toml: |
    # Generated by the Beehive Helm chart from its values. Every key is defined in
    # docs/spec/server.md section 2. A value of exactly $NAME is the environment variable NAME.

    [server]
    edition = {{ .Values.config.edition | quote }}
    listen = "0.0.0.0:7420"
    public_url = "$BEE_PUBLIC_URL"
    advertise_url = "$BEE_ADVERTISE_URL"
    data_dir = "/data"
    cell = {{ .Values.config.cell | quote }}
    region = {{ .Values.config.region | quote }}
    trust_forwarded_for = {{ .Values.config.trustForwardedFor }}

    [metadata]
    backend = "postgres"
    postgres_url = "$BEE_POSTGRES_URL"
    postgres_schema = {{ .Values.config.postgres.schema | quote }}
    max_connections = {{ .Values.config.postgres.maxConnections }}

    [blobs]
    backend = "s3"
    {{- if .Values.secrets.sharedKeys.enabled }}
    url_key_hex = "$BEE_URL_KEY_HEX"
    {{- end }}
    s3_bucket = "$BEE_S3_BUCKET"
    s3_region = {{ .Values.config.s3.region | quote }}
    {{- if .Values.config.s3.endpoint }}
    s3_endpoint = "$BEE_S3_ENDPOINT"
    {{- end }}
    s3_access_key_id = "$BEE_S3_ACCESS_KEY"
    s3_secret_access_key = "$BEE_S3_SECRET_KEY"
    s3_prefix = {{ .Values.config.s3.blobPrefix | quote }}

    [auth]
    signing_key_hex = "$BEE_SIGNING_KEY_HEX"
    {{- if .Values.secrets.sharedKeys.enabled }}
    oidc_key_pkcs8_hex = "$BEE_OIDC_KEY_HEX"
    {{- end }}

    [forge]
    database = "$BEE_FORGE_DATABASE"
    site_admins = {{ .Values.config.siteAdmins | toJson }}

    [import]
    allowed_roots = {{ .Values.config.importAllowedRoots | toJson }}

    [backup]
    target = "s3"
    s3_prefix = {{ .Values.config.s3.backupPrefix | quote }}
    retention_days = {{ .Values.config.s3.backupRetentionDays }}

    [admission]
    per_principal_rps = {{ .Values.config.admission.perPrincipalRps }}
    per_root_rps = {{ .Values.config.admission.perRootRps }}

    [limits]
    forge_lookup_deadline_ms = {{ .Values.config.forgeLookupDeadlineMs }}

    [logging]
    level = {{ .Values.config.logging.level | quote }}
    requests = {{ .Values.config.logging.requests }}
    {{- with .Values.config.tracingOtlpEndpoint }}

    [tracing]
    otlp_endpoint = {{ . | quote }}
    {{- end }}
    {{- $login := .Values.config.login }}
    {{- if or $login.oidcIssuer $login.githubClientId $login.defaultOrg }}

    [login]
    {{- if $login.oidcIssuer }}
    oidc_issuer = {{ $login.oidcIssuer | quote }}
    {{- end }}
    {{- if $login.oidcClientId }}
    oidc_client_id = {{ $login.oidcClientId | quote }}
    {{- end }}
    {{- if $login.githubClientId }}
    github_client_id = {{ $login.githubClientId | quote }}
    {{- end }}
    {{- if $login.defaultOrg }}
    default_org = {{ $login.defaultOrg | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.config.extraToml }}

    {{- . | nindent 4 }}
    {{- end }}
{{- end }}
