apiVersion: v1
kind: Service
metadata:
  name: {{ include "bee.fullname" . }}-server
  labels:
    {{- include "bee.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "bee.selectorLabels" (dict "ctx" . "component" "server") | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.server.service.port }}
      targetPort: api
      protocol: TCP
      # HTTP/2 without TLS: gRPC and HTTP/JSON on one port.
      appProtocol: kubernetes.io/h2c
{{- if .Values.ssh.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bee.fullname" . }}-ssh
  labels:
    {{- include "bee.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.ssh.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ssh.service.type }}
  selector:
    {{- include "bee.selectorLabels" (dict "ctx" . "component" "server") | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.ssh.service.port }}
      targetPort: ssh
      protocol: TCP
      appProtocol: ssh
{{- end }}
{{- if .Values.web.enabled }}
---
apiVersion: v1
