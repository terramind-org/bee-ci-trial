# Postgres 17, an S3-compatible store and a mock OIDC provider for scripts/check-helm.sh.
# Needs the Secret ci-credentials with keys postgres-password, s3-access-key and s3-secret-key.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_USER
              value: bee
            - name: POSTGRES_DB
              value: bee
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ci-credentials
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Each server replica holds about 50 connections right after it starts (16 metadata,
          # 4 server tables, 4 per forge surface it has used). With Postgres's default of 100,
          # two replicas plus a rolling-update surge pod leave the forge unable to connect.
          args: ["-c", "max_connections=400"]
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bee", "-d", "bee"]
            periodSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ci-credentials
                  key: s3-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ci-credentials
                  key: s3-secret-key
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
# Creates the bucket the chart expects to exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-init
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:2.39.3
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ci-credentials
                  key: s3-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ci-credentials
                  key: s3-secret-key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - /bin/sh
            - -c
            - |
              until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket bee 2>/dev/null \
                || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket bee; do
                echo "waiting for the object store"; sleep 2
              done
              echo "bucket bee is ready"
---
# Any OIDC login succeeds, which is how the script becomes the first admin without a real IdP.
apiVersion: v1
kind: Service
metadata:
  name: mock-oidc
spec:
  selector:
    app: mock-oidc
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oidc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-oidc
  template:
    metadata:
      labels:
        app: mock-oidc
    spec:
      containers:
        - name: mock-oidc
          image: ghcr.io/navikt/mock-oauth2-server:2.1.10
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: http
            periodSeconds: 3
            failureThreshold: 30
