# Scaled-out stack: three Beehive server replicas on one Postgres and one S3 store, behind a
# Caddy load balancer, plus the web app. Walkthrough and measured numbers: docs/scaling.md.
#
#   cp deploy/.env.example deploy/.env          # replace every CHANGE-ME, then add the OpenID key
#   echo "BEE_OIDC_KEY_HEX=$(openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 | openssl pkcs8 -topk8 -nocrypt -outform DER | xxd -p | tr -d '\n')" >> deploy/.env
#   docker compose -f deploy/compose.scale.yml --env-file deploy/.env build
#   docker compose -f deploy/compose.scale.yml --env-file deploy/.env up -d --wait
#
# Replicas keep no state another replica needs: every repo, ref, lease and token lives in
# Postgres and S3. Each replica has its own data volume for caches and local work directories.
# Lands on a protected ref go through one fenced coalescer owner across all replicas
# (SPEC 7.4); the others forward to it at its advertise_url.

name: bee-scale

x-server-env: &server-env
  BEE_PUBLIC_URL: ${BEE_PUBLIC_URL:?set BEE_PUBLIC_URL in deploy/.env}
  BEE_POSTGRES_URL: ${BEE_POSTGRES_URL:?set BEE_POSTGRES_URL in deploy/.env}
  BEE_FORGE_DATABASE: ${BEE_FORGE_DATABASE:?set BEE_FORGE_DATABASE in deploy/.env}
  BEE_S3_ENDPOINT: ${BEE_S3_ENDPOINT:-http://s3:9000}
  BEE_S3_BUCKET: ${BEE_S3_BUCKET:-bee}
  BEE_S3_ACCESS_KEY: ${BEE_S3_ACCESS_KEY:?set BEE_S3_ACCESS_KEY in deploy/.env}
  BEE_S3_SECRET_KEY: ${BEE_S3_SECRET_KEY:?set BEE_S3_SECRET_KEY in deploy/.env}
  BEE_SIGNING_KEY_HEX: ${BEE_SIGNING_KEY_HEX:?set BEE_SIGNING_KEY_HEX in deploy/.env}
  BEE_URL_KEY_HEX: ${BEE_URL_KEY_HEX:?set BEE_URL_KEY_HEX in deploy/.env (openssl rand -hex 32)}
  BEE_OIDC_KEY_HEX: ${BEE_OIDC_KEY_HEX:?set BEE_OIDC_KEY_HEX in deploy/.env (see the top of this file)}

x-server: &server
  image: ${BEE_SERVER_IMAGE:-bee-server:latest}
  restart: unless-stopped
  command: ["--config", "/etc/bee/server.toml"]
  depends_on:
    postgres:
      condition: service_healthy
    s3-init:
      condition: service_completed_successfully
    bee-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # Every replica holds its own connections: up to metadata.max_connections (16) for the
    # metadata store, 4 for the server tables, and up to 4 per forge surface it has used, which
    # it keeps open. Three replicas need more than Postgres's default of 100 right after they
    # start (docs/scaling.md has the measured counts).
    command: ["postgres", "-c", "max_connections=${BEE_POSTGRES_MAX_CONNECTIONS:-400}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-bee}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object store. To use another one, delete these two services and set the
  # BEE_S3_* variables in deploy/.env.
  s3:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${BEE_S3_ACCESS_KEY:?set BEE_S3_ACCESS_KEY in deploy/.env}
      RUSTFS_SECRET_KEY: ${BEE_S3_SECRET_KEY:?set BEE_S3_SECRET_KEY in deploy/.env}
    volumes:
      - s3-data:/data

  s3-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${BEE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BEE_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      BEE_S3_ENDPOINT: ${BEE_S3_ENDPOINT:-http://s3:9000}
      BEE_S3_BUCKET: ${BEE_S3_BUCKET:-bee}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url "$$BEE_S3_ENDPOINT" s3api head-bucket --bucket "$$BEE_S3_BUCKET" 2>/dev/null \
          || aws --endpoint-url "$$BEE_S3_ENDPOINT" s3api create-bucket --bucket "$$BEE_S3_BUCKET"; do
          echo "waiting for the object store"; sleep 2
        done
        echo "bucket $$BEE_S3_BUCKET is ready"
    restart: "no"

  # Checks the configuration once, before any replica starts. Schema migrations run in the
  # replicas themselves and are safe to run concurrently.
  bee-init:
    image: ${BEE_SERVER_IMAGE:-bee-server:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["--config", "/etc/bee/server.toml", "--check-config"]
    environment:
      <<: *server-env
      BEE_ADVERTISE_URL: http://bee-init:7420
    volumes:
      - ./scale/server.toml:/etc/bee/server.toml:ro
    restart: "no"

  server-1:
    <<: *server
    environment:
      <<: *server-env
      BEE_ADVERTISE_URL: http://server-1:7420
    volumes:
      - ./scale/server.toml:/etc/bee/server.toml:ro
      - server-1-data:/data

  server-2:
    <<: *server
    environment:
      <<: *server-env
      BEE_ADVERTISE_URL: http://server-2:7420
    volumes:
      - ./scale/server.toml:/etc/bee/server.toml:ro
      - server-2-data:/data

  server-3:
    <<: *server
    environment:
      <<: *server-env
      BEE_ADVERTISE_URL: http://server-3:7420
    volumes:
      - ./scale/server.toml:/etc/bee/server.toml:ro
      - server-3-data:/data

  # The load balancer: round robin over the replicas, HTTP/2 cleartext (h2c) to them so gRPC
  # passes through, HTTP/1.1 and h2c from clients. It serves the API, git smart HTTP and MCP on
  # one port; put a TLS front (deploy/Caddyfile) or your own balancer before it in production.
  lb:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server-1
      - server-2
      - server-3
    volumes:
      - ./scale/Caddyfile:/etc/caddy/Caddyfile:ro
      - lb-data:/data
      - lb-config:/config
    ports:
      - "${BEE_API_BIND:-127.0.0.1}:${BEE_API_PORT:-7420}:7420"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7420/readyz"]
      interval: 2s
      timeout: 2s
      retries: 60

  web:
    image: ${BEE_WEB_IMAGE:-bee-web:latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      lb:
        condition: service_healthy
    environment:
      BEE_API_URL: http://lb:7420
      PORT: "3100"
    ports:
      - "${BEE_WEB_PORT:-3100}:3100"

volumes:
  postgres-data:
  s3-data:
  server-1-data:
  server-2-data:
  server-3-data:
  lb-data:
  lb-config:
