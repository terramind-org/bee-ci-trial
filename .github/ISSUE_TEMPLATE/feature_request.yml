name: Feature request
description: Propose a concrete improvement to Bee.
title: "feature: "
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or agent task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior and how it could be evaluated.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
