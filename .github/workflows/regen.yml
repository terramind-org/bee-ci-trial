name: regen (trial only)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: check
      - run: scripts/dev-setup.sh
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo run -p bee-proto --bin bee-proto-gen
          git status --short
          git diff > regen.patch
      - uses: actions/upload-artifact@v4
        with:
          name: regen
          path: regen.patch
          retention-days: 3
