name: regen (trial only)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to regenerate
        default: check
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: scripts/dev-setup.sh
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate
        run: |
          cargo run -p bee-proto --bin bee-proto-gen
          git add -A
          git status --short
          git diff --cached --binary > regen.patch
      - uses: actions/upload-artifact@v4
        with:
          name: regen
          path: regen.patch
          retention-days: 3
      # Early compile feedback for a branch written without a compiler.
      - name: Compile everything with lints
        run: cargo clippy --workspace --all-targets -- -D warnings
