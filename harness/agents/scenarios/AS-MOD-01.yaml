id: AS-MOD-01
area: "4.21"
title: As a moderator agent, hide spam, block its author and set interaction limits
surfaces: both
timeout: 900
budget: { max_turns: 60 }
fixtures: [base]
setup:
  - name: make the repo public
    call: RepoService/UpdateRepo
    request: { repo: { fullName: "${repo.fullName}" }, visibility: VISIBILITY_PUBLIC }
  - name: the worker moderates the org
    call: ModerationService/AddModerator
    request: { org: "${run.ns}", principalId: "${worker.id}" }
  - call: AuthService/MintToken
    request: { principalId: "${worker.id}", scope: { repos: ["${run.ns}/*"], actions: [read, review, issues_write, triage, manage_policy, manage_settings], session: "${run.session}" } }
    save: { modToken: token }
  - name: a spammer and a legitimate contributor (agents owned by other principals)
    call: AuthService/CreateAgent
    each: ["spam-${run.ns}", "helpful-${run.ns}"]
    request: { display: "${item}", runtime: script, purpose: "community member", org: "" }
    save: { people: "$" }
  - name: let both join the org and the repo (forge calls need both)
    call: OrgService/SetMember
    request: { org: "${run.ns}", principalId: "${people[0].id}", role: ROLE_MEMBER }
  - call: OrgService/SetMember
    request: { org: "${run.ns}", principalId: "${people[1].id}", role: ROLE_MEMBER }
  - call: RepoService/AddCollaborator
    request: { repo: { fullName: "${repo.fullName}" }, principalId: "${people[0].id}", role: REPO_ROLE_WRITE }
  - call: RepoService/AddCollaborator
    request: { repo: { fullName: "${repo.fullName}" }, principalId: "${people[1].id}", role: REPO_ROLE_WRITE }
  - call: AuthService/MintToken
    request: { principalId: "${people[0].id}", scope: { actions: [read, review, issues_write] } }
    save: { spamToken: token }
  - call: AuthService/MintToken
    request: { principalId: "${people[1].id}", scope: { actions: [read, review, issues_write] } }
    save: { helpfulToken: token }
  - call: IssueService/CreateIssue
    request: { repo: { fullName: "${repo.fullName}" }, title: "Crash on startup with Python 3.13", body: "Traceback attached." }
    save: { issue: "$" }
  - call: IssueService/CreateIssueComment
    as: "${spamToken}"
    each:
      - "BUY CHEAP FOLLOWERS at http://spam.example/now !!!"
      - "Crypto giveaway, send 1 coin get 2 back: http://spam.example/coin"
    request: { repo: { fullName: "${repo.fullName}" }, number: "${issue.number}", body: "${item}" }
    save: { spam: id }
  - call: IssueService/CreateIssueComment
    as: "${helpfulToken}"
    request: { repo: { fullName: "${repo.fullName}" }, number: "${issue.number}", body: "Same here; it works on 3.12. The crash is in the config loader." }
    save: { helpful: "$" }
agent:
  token: "${modToken}"
prompt: |
  You moderate the bee org ${run.ns}. Issue #${issue.number} in ${repo.fullName} is being
  spammed. Hide the spam (leave genuine comments alone), block the spammer from the org, and
  limit interactions on the repository to prior contributors for the next 24 hours.
assertions:
  - name: both spam comments are hidden as spam; the genuine one is visible
    call: IssueService/ListIssueComments
    request: { repo: { fullName: "${repo.fullName}" }, number: "${issue.number}" }
    expect:
      - path: comments
        count_gte: 2
        where:
          - { path: author.id, eq: "${people[0].id}" }
          - { path: minimizedReason, eq: MINIMIZED_REASON_SPAM }
      - path: comments
        some:
          - { path: id, eq: "${helpful.id}" }
          - { path: minimizedReason, absent: true }
  - name: the spammer is blocked from the org
    call: ModerationService/ListBlockedUsers
    request: { scope: { org: "${run.ns}" } }
    expect:
      - { path: "blocks[*].blocked.id", contains: "${people[0].id}" }
      - { path: "blocks[*].blocked.id", not_contains: "${people[1].id}" }
  - name: interactions are limited to contributors
    call: ModerationService/GetInteractionLimit
    request: { scope: { repo: { fullName: "${repo.fullName}" } } }
    expect:
      - { path: level, eq: INTERACTION_LIMIT_LEVEL_CONTRIBUTORS_ONLY }
      - { path: expiresAt, within: { from: "${time:+23h}", ms: 7200000 } }
  - name: the spammer can no longer comment
    call: IssueService/CreateIssueComment
    as: "${spamToken}"
    request: { repo: { fullName: "${repo.fullName}" }, number: "${issue.number}", body: "one more ad" }
    expect_error: { reason: [BLOCKED, INTERACTION_LIMITED] }
