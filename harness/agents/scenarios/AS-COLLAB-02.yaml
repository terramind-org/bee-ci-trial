id: AS-COLLAB-02
area: "4.16"
title: "Work through the notification inbox: review requests, mentions, done"
surfaces: both
timeout: 1200
budget: { max_turns: 80 }
fixtures: [base]
setup:
  - commit: { repo: "${repo.fullName}", ref: main, message: "Seed", files: { src/limits.py: "MAX_UPLOAD_MB = 10\n" } }
  - name: a teammate agent who generates the notifications
    call: AuthService/CreateAgent
    request: { display: "teammate-${run.ns}", runtime: codex, purpose: "feature work", org: "${run.ns}" }
    save: { mate: "$" }
  - name: let mate join the org and the repo (forge calls need both)
    call: OrgService/SetMember
    request: { org: "${run.ns}", principalId: "${mate.id}", role: ROLE_MEMBER }
  - call: RepoService/AddCollaborator
    request: { repo: { fullName: "${repo.fullName}" }, principalId: "${mate.id}", role: REPO_ROLE_WRITE }
  - call: AuthService/MintToken
    request: { principalId: "${mate.id}", scope: { repos: ["${repo.fullName}"], actions: [read, commit, review, manage_refs, triage, issues_write] } }
    save: { mateToken: token }
  - name: a review request for the worker
    commit:
      repo: "${repo.fullName}"
      ref: main
      as: "${mateToken}"
      land: false
      ref_name: ws/upload
      change: upload
      message: "Raise upload limit"
      files: { src/limits.py: "MAX_UPLOAD_MB = 25\n" }
    save: head
  - call: ChangeService/OpenChange
    as: "${mateToken}"
    request: { repo: { fullName: "${repo.fullName}" }, targetRef: main, head: "${head.id}", title: "Raise the upload limit to 25 MB", reviewerIds: ["${worker.id}"] }
    save: { cr: "$" }
  - name: a mention of the worker in an issue
    call: IssueService/CreateIssue
    as: "${mateToken}"
    request: { repo: { fullName: "${repo.fullName}" }, title: "Upload limit for enterprise customers", body: "What should the enterprise limit be?" }
    save: { issue: "$" }
  - call: IssueService/CreateIssueComment
    as: "${mateToken}"
    request: { repo: { fullName: "${repo.fullName}" }, number: "${issue.number}", body: "@${worker.display} can you confirm the current upload limit in src/limits.py?" }
  - name: the inbox has both
    call: NotificationService/ListNotificationThreads
    as: "${workerToken}"
    request: {}
    retry: { attempts: 10, interval_ms: 1000 }
    expect:
      - { path: "threads[*].reason", contains: NOTIFICATION_REASON_REVIEW_REQUESTED }
      - { path: "threads[*].reason", contains: NOTIFICATION_REASON_MENTION }
agent:
  token: "${workerToken}"
prompt: |
  Go through your notification inbox on the bee server. Act on everything that needs you:
  review what you were asked to review, and answer anyone who asked you a question. Mark each
  notification done once you have dealt with it, until the inbox is empty.
assertions:
  - name: the worker reviewed the CR
    call: ChangeService/ListReviews
    request: { repo: { fullName: "${repo.fullName}" }, changeRequestId: "${cr.id}" }
    expect:
      - path: reviews
        some:
          - { path: reviewer.id, eq: "${worker.id}" }
          - { path: verdict, in: [VERDICT_APPROVE, VERDICT_REQUEST_CHANGES, VERDICT_COMMENT] }
  - name: the worker answered the mention with the actual limit
    call: IssueService/ListIssueComments
    request: { repo: { fullName: "${repo.fullName}" }, number: "${issue.number}" }
    expect:
      - path: comments
        some:
          - { path: author.id, eq: "${worker.id}" }
          - { path: body, matches: "\\b10\\b" }
  - name: the inbox is empty and both threads are done
    call: NotificationService/ListNotificationThreads
    as: "${workerToken}"
    request: {}
    expect:
      - { path: threads, len: 0 }
  - call: NotificationService/ListNotificationThreads
    as: "${workerToken}"
    request: { filter: { doneOnly: true } }
    expect:
      - { path: threads, len_gte: 2 }
