id: AS-CORE-02
area: "4.1"
title: Find which change introduced a given line and who (or which agent) made it
surfaces: both
timeout: 900
budget: { max_turns: 60 }
fixtures: [base]
setup:
  - name: register the agent that will introduce the line
    call: AuthService/CreateAgent
    request: { display: "retry-tuner-${run.ns}", runtime: codex, purpose: "network tuning", org: "${run.ns}" }
    save: { tuner: "$" }
  - name: let tuner join the org and the repo (forge calls need both)
    call: OrgService/SetMember
    request: { org: "${run.ns}", principalId: "${tuner.id}", role: ROLE_MEMBER }
  - call: RepoService/AddCollaborator
    request: { repo: { fullName: "${repo.fullName}" }, principalId: "${tuner.id}", role: REPO_ROLE_WRITE }
  - call: AuthService/MintToken
    request:
      principalId: "${tuner.id}"
      scope: { repos: ["${repo.fullName}"], actions: [read, commit, land], session: "tuning-session-1" }
    save: { tunerToken: token }
  - name: first version of the file (by the admin)
    commit:
      repo: "${repo.fullName}"
      ref: main
      message: "Add retry helper"
      files:
        src/net/retry.py: |
          import time

          MAX_RETRIES = 3
          BACKOFF_SECONDS = 0.5
    save: first
  - name: the tuner agent changes the line
    commit:
      repo: "${repo.fullName}"
      ref: main
      as: "${tunerToken}"
      message: "Tune retries for flaky upstream"
      provenance: { runtime: codex, model: "harness-model", session: "tuning-session-1" }
      files:
        src/net/retry.py: |
          import time

          MAX_RETRIES = 7
          BACKOFF_SECONDS = 0.5
    save: intro
  - name: later unrelated edits by the admin to the same file
    commit:
      repo: "${repo.fullName}"
      ref: main
      message: "Raise backoff"
      files:
        src/net/retry.py: |
          import time

          MAX_RETRIES = 7
          BACKOFF_SECONDS = 1.5
        src/net/__init__.py: ""
agent:
  token: "${workerToken}"
prompt: |
  In the bee repository ${repo.fullName}, the line `MAX_RETRIES = 7` in `src/net/retry.py` on
  main is causing trouble. Find the change that introduced that line and who made it (a person
  or an agent; if an agent, which one).

  Write your answer to `answer.json` in the current directory as:
  {"changeset": "<id of the change that introduced the line>", "principal": "<id or name of whoever made it>"}
assertions:
  - name: ground truth - blame attributes line 3 to the tuner's changeset
    call: QueryService/Blame
    request: { repo: { fullName: "${repo.fullName}" }, at: { expr: main }, path: "${b64:src/net/retry.py}", startLine: 3, endLine: 3 }
    expect:
      - { path: "ranges[0].changeset.raw", eq: "${intro.result.raw}" }
  - name: the agent named the introducing changeset and the tuner agent
    answer:
      file: answer.json
      expect:
        - { path: changeset, prefix_of: "${id:intro.result}" }
        - { path: principal, in: ["${tuner.id}", "${tuner.display}"] }
