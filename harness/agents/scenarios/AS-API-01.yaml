id: AS-API-01
area: "4.8"
title: Point unmodified gh at Beehive and open, review and merge a PR
surfaces: cli
timeout: 1200
budget: { max_turns: 80 }
requires: ["bin:gh"]
notes: >
  The agent gets GH_HOST and GH_ENTERPRISE_TOKEN for the server (the stock way to point gh at
  a GitHub Enterprise-compatible host) and must use `gh` itself. The reviewer token is a second
  agent's, so the review is not a self-approval.
fixtures: [base]
setup:
  - commit:
      repo: "${repo.fullName}"
      ref: main
      message: "Seed"
      files:
        app/version.txt: "1.0.0\n"
  - name: the branch to propose, created by the worker
    commit:
      repo: "${repo.fullName}"
      ref: main
      as: "${workerToken}"
      land: false
      ref_name: bump-version
      change: bump
      message: "Bump version to 1.1.0"
      files:
        app/version.txt: "1.1.0\n"
  - name: a second agent who will review through gh
    call: AuthService/CreateAgent
    request: { display: "gh-reviewer-${run.ns}", runtime: claude-code, purpose: "review", org: "${run.ns}" }
    save: { reviewer: "$" }
  - name: let reviewer join the org and the repo (forge calls need both)
    call: OrgService/SetMember
    request: { org: "${run.ns}", principalId: "${reviewer.id}", role: ROLE_MEMBER }
  - call: RepoService/AddCollaborator
    request: { repo: { fullName: "${repo.fullName}" }, principalId: "${reviewer.id}", role: REPO_ROLE_WRITE }
  - call: AuthService/MintToken
    request: { principalId: "${reviewer.id}", scope: { repos: ["${repo.fullName}"], actions: [read, review] } }
    save: { reviewerToken: token }
agent:
  token: "${workerToken}"
  env:
    GH_HOST: "${run.server.host}"
    GH_ENTERPRISE_TOKEN: "${workerToken}"
    REVIEWER_GH_TOKEN: "${reviewerToken}"
prompt: |
  The GitHub CLI `gh` on this machine is configured for a GitHub-compatible host (see GH_HOST).
  Using `gh` only, in the repository ${repo.fullName} on that host:

  1. open a pull request from the branch `bump-version` into `main`, titled "Bump version to 1.1.0";
  2. approve it as the reviewer, whose token is in the REVIEWER_GH_TOKEN environment variable;
  3. merge it.
assertions:
  - name: the PR exists, landed, and was opened by the worker
    call: ChangeService/ListChanges
    request: { repo: { fullName: "${repo.fullName}" }, state: CHANGE_STATE_LANDED }
    expect:
      - { path: changes, len: 1 }
      - { path: "changes[0].title", eq: "Bump version to 1.1.0" }
      - { path: "changes[0].author.id", eq: "${worker.id}" }
    save: { cr: "changes[0]" }
  - name: the reviewer approved it
    call: ChangeService/ListReviews
    request: { repo: { fullName: "${repo.fullName}" }, changeRequestId: "${cr.id}" }
    expect:
      - path: reviews
        some:
          - { path: reviewer.id, eq: "${reviewer.id}" }
          - { path: verdict, eq: VERDICT_APPROVE }
  - name: main has the merged content
    call: QueryService/ReadPath
    request: { repo: { fullName: "${repo.fullName}" }, at: { expr: main }, path: "${b64:app/version.txt}" }
    expect:
      - { path: "messages[0].data", decode: base64, eq: "1.1.0\n" }
