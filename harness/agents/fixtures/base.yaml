# The starting state most scenarios share, created fresh for every run:
#   org     ${run.ns}            (unique per run, so runs never see each other)
#   repo    ${run.ns}/app        (auto-initialised; `main` exists)
#   worker  an agent principal owned by the harness admin, with a token scoped to the repo whose
#           session is ${run.session}, so provenance ties every change to this run.
setup:
  - name: create the run's org
    call: OrgService/CreateOrg
    request: { name: "${run.ns}", display: "agent harness ${run.ns}" }
    save: { org: "$" }
  - name: create the repo
    call: RepoService/CreateRepo
    request:
      org: "${run.ns}"
      name: app
      visibility: VISIBILITY_PRIVATE
      description: "agent scenario ${scenario.id}"
      autoInit: true
    save: { repo: "$" }
  - name: register the worker agent
    call: AuthService/CreateAgent
    request:
      display: "worker-${run.ns}"
      runtime: "${run.runtime}"
      purpose: "agent scenario ${scenario.id}"
      org: "${run.ns}"
    save: { worker: "$" }
  - name: let worker join the org and the repo (forge calls need both)
    call: OrgService/SetMember
    request: { org: "${run.ns}", principalId: "${worker.id}", role: ROLE_MEMBER }
  - call: RepoService/AddCollaborator
    request: { repo: { fullName: "${repo.fullName}" }, principalId: "${worker.id}", role: REPO_ROLE_WRITE }
  - name: mint the worker's token
    call: AuthService/MintToken
    request:
      principalId: "${worker.id}"
      scope:
        repos: ["${repo.fullName}"]
        actions: [read, commit, land, review, lease, manage_refs, triage, issues_write]
        session: "${run.session}"
    save: { workerToken: token, workerTokenId: tokenId }
