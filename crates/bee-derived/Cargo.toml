[package]
name = "bee-derived"
description = "Derived-data framework: blame, skip lists, path indexes, eager and lazy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-core = { path = "../bee-core" }
bee-object = { path = "../bee-object" }
bee-store = { path = "../bee-store" }
bee-history = { path = "../bee-history" }
bee-merge = { path = "../bee-merge" }
bee-classify = { path = "../bee-classify" }
async-trait = "=0.1.92"
tokio = { version = "=1.53.3", features = ["sync"] }

[dev-dependencies]
bee-testkit = { path = "../bee-testkit" }
tokio = { version = "=1.53.3", features = ["time", "rt", "rt-multi-thread", "macros", "sync"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
