[package]
name = "bee-mcp"
description = "MCP server exposing every bee operation as a tool (run as `bee mcp`)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-core = { path = "../bee-core" }
bee-proto = { path = "../bee-proto" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
bytes = "=1.11.0"
getrandom = "=0.4.3"
http = "=1.3.1"
http-body-util = "=0.1.3"
hyper = "=1.12.0"
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
prost = "=0.14.4"
prost-types = "=0.14.4"
# float_roundtrip: responses are re-printed, so parsing must not change a number's last digit.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "sync", "time"] }

[dev-dependencies]
futures-util = { version = "=0.3.31", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
