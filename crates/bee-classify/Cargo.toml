[package]
name = "bee-classify"
description = "Semantic diff classes (SPEC 11.3): generated, docs, comment-only, test-only, rename-only, dependency, logic, sensitive."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-core = { path = "../bee-core" }

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
