[package]
name = "bee-git-http"
description = "Git smart HTTP (upload-pack, receive-pack) served from bee, with pushes landing under policy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-core = { path = "../bee-core" }
bee-object = { path = "../bee-object" }
bee-git = { path = "../bee-git" }
bee-store = { path = "../bee-store" }
bee-history = { path = "../bee-history" }
bee-import = { path = "../bee-import" }
bee-proto = { path = "../bee-proto" }
# The backend and session traits are async and object-safe, like the store traits.
async-trait = "=0.1.92"
# The HTTP surface is an axum router the server merges into its single listener.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
# HTTP Basic credentials are base64.
base64 = "=0.22.1"
# Pack cache keys.
blake3 = "=1.8.7"
bytes = "=1.11.0"
# git sends large upload-pack requests gzip-compressed (`Content-Encoding: gzip`).
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# HMAC-SHA256 signs the LFS transfer URLs.
hmac = "=0.12.1"
http = "=1.3.1"
http-body-util = "=0.1.3"
# The LFS batch API is JSON.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# LFS object ids are SHA-256 of the content.
sha2 = "=0.10.9"
tokio = { version = "=1.53.3", features = ["sync", "net", "io-util", "rt", "time", "macros"] }
# Host keys are generated from operating-system randomness (the same pin as bee-server).
getrandom = "=0.4.3"
# Git over SSH: an SSH server with public-key auth and exec channels, in pure Rust. The `ring`
# backend (already in the workspace through the token stack) avoids a second C crypto library;
# `rsa` keeps RSA user keys working. Chosen over libssh2 (client only) and shelling out to
# sshd (not embeddable, no principal mapping). Its `russh::keys` re-exports the OpenSSH key
# parser and fingerprints, so no second key crate is needed.
russh = { version = "=0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }

[dev-dependencies]
bee-server = { path = "../bee-server" }
# Mints tokens for test principals (git_access.rs).
bee-auth = { path = "../bee-auth" }
bee-secrets = { path = "../bee-secrets" }
bee-mcp = { path = "../bee-mcp" }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time", "sync"] }
# Fuzzing of the protocol parsers (tests/fuzz.rs); the workspace's pinned version.
proptest = "=1.12.0"

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
