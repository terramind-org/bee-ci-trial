[package]
name = "bee-secrets"
description = "Secret detection for push protection at CreateChangeset, Land and git push (PRODUCT 4.18)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-core = { path = "../bee-core" }
aho-corasick = "=1.1.5"
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"

[dev-dependencies]
proptest = "=1.12.0"

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
