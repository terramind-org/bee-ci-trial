[package]
name = "bee-import"
description = "One-way git history importer with git-to-bee mappings."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-git = { path = "../bee-git" }
bee-core = { path = "../bee-core" }
bee-object = { path = "../bee-object" }
bee-store = { path = "../bee-store" }
# The DerivedHook trait is async and object-safe, like the store traits.
async-trait = "=0.1.92"
# The key of a tag ref's annotated-tag row hashes the ref name and the changeset.
blake3 = "=1.8.7"
# zlib for random access into packfile entries (same pure-Rust backend as bee-git).
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# The fidelity report is JSON (schemas/v1/import-report.schema.json).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The bee-import binary drives the async pipeline on a current-thread runtime.
tokio = { version = "=1.53.3", features = ["rt"] }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["rt", "macros"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
