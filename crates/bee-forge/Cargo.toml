[package]
name = "bee-forge"
description = "Beehive: orgs, repos, change requests, reviews, checks, leases, events, provenance."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-core = { path = "../bee-core" }
bee-object = { path = "../bee-object" }
bee-store = { path = "../bee-store" }
bee-history = { path = "../bee-history" }
bee-merge = { path = "../bee-merge" }
bee-policy = { path = "../bee-policy" }
bee-auth = { path = "../bee-auth" }
bee-proto = { path = "../bee-proto" }
bee-search = { path = "../bee-search" }
bee-workflow = { path = "../bee-workflow" }
async-trait = "=0.1.92"
blake3 = "=1.8.7"
bytes = "=1.11.0"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
# Reason: SecretService.PutSecret takes libsodium sealed boxes (X25519 + XSalsa20-Poly1305);
# pure Rust (RustCrypto nacl-compat), its curve25519-dalek is already in the lockfile.
crypto_box = { version = "=0.9.1", default-features = false, features = ["alloc", "rand_core", "salsa20", "seal"] }
# Reason: gunzip SARIF uploads (UploadSarif carries gzip bytes); pure-Rust backend, already in the lockfile.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "=0.4.3"
hmac = "=0.12.1"
http = "=1.3.1"
http-body-util = "=0.1.3"
hyper = "=1.12.0"
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
pbjson-types = "=0.9.0"
prost = "=0.14.4"
# Reason: body_html renders issue Markdown; parser only (no default features, so no new crate:
# it is already in the lockfile), HTML is emitted by `markdown.rs` from a fixed tag set.
pulldown-cmark = { version = "=0.13.4", default-features = false }
ring = "=0.17.14"
# Reason: custom secret patterns carry must_match / must_not_match regexes; same pin and features as bee-secrets.
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf"] }
roxmltree = "=0.21.1"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.53.3", features = ["rt", "sync", "time", "macros", "process", "io-util", "fs"] }
tokio-postgres = "=0.7.18"
tokio-stream = "=0.1.17"
# Reason: post text is stored as NFC (PostService rules); already in the lockfile (0.1.26).
unicode-normalization = "=0.1.26"
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
bee-classify = { path = "../bee-classify" }
bee-derived = { path = "../bee-derived" }
bee-secrets = { path = "../bee-secrets" }
bee-deps = { path = "../bee-deps" }

[dev-dependencies]
bee-git = { path = "../bee-git" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
