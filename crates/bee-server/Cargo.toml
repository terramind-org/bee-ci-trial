[package]
name = "bee-server"
description = "bee-server: the single server binary (VCS + Beehive API + web assets)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "bee-server"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bee-server"
path = "src/main.rs"

[[bin]]
name = "bee-server-bench"
path = "src/bin/bench.rs"

[dependencies]
bee-auth = { path = "../bee-auth" }
bee-core = { path = "../bee-core" }
bee-derived = { path = "../bee-derived" }
bee-forge = { path = "../bee-forge" }
bee-compat = { path = "../bee-compat" }
bee-git = { path = "../bee-git" }
bee-git-http = { path = "../bee-git-http" }
bee-github = { path = "../bee-github" }
bee-history = { path = "../bee-history" }
bee-import = { path = "../bee-import" }
bee-mcp = { path = "../bee-mcp" }
bee-merge = { path = "../bee-merge" }
bee-object = { path = "../bee-object" }
bee-policy = { path = "../bee-policy" }
bee-proto = { path = "../bee-proto" }
bee-search = { path = "../bee-search" }
bee-secrets = { path = "../bee-secrets" }
bee-store = { path = "../bee-store" }
bee-store-blob = { path = "../bee-store-blob" }
bee-store-sql = { path = "../bee-store-sql" }
async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
# Basic credentials of package registry clients (npm, Maven, NuGet, Cargo, OCI).
base64 = "=0.22.1"
blake3 = "=1.8.7"
bytes = "=1.11.0"
# gzip of exported migration archives (the format bee-github reads; already in the workspace).
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "=0.3.31", default-features = false, features = ["std", "sink"] }
getrandom = "=0.4.3"
http = "=1.3.1"
http-body = "=1.0.1"
http-body-util = "=0.1.3"
pbjson-types = "=0.9.0"
# id_tokens as an OIDC provider (ES256) and external id_token / commit-signature checks
# (RSA, ECDSA, Ed25519); the workspace's pinned ring, already used by bee-forge.
ring = "=0.17.14"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
# TLS and mutual TLS on the main listener (`[tls]`): rustls with the ring provider, already in
# the lockfile through hyper-rustls; tokio-rustls drives handshakes on tokio streams.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# SHA-1 for TOTP's HMAC-SHA1 (RFC 6238); already the workspace's SHA-1 (bee-git).
sha1collisiondetection = { version = "=0.3.4", default-features = false, features = ["std"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time"] }
tokio-postgres = "=0.7.18"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "=1.1.8"
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
tower = { version = "=0.5.2", default-features = false, features = ["util"] }

[dev-dependencies]
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
# The GitHub import e2e test reuses bee-github's fake GitHub harness, which validates
# reports (jsonschema) and serves LFS objects by SHA-256 (sha2).
jsonschema = { version = "=0.59.0", default-features = false }
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[lints]
workspace = true
