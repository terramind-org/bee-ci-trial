[package]
name = "bee-store-sql"
description = "Metadata store on Postgres (production) and SQLite (dev mode)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-core = { path = "../bee-core" }
bee-object = { path = "../bee-object" }
bee-store = { path = "../bee-store" }
async-trait = "=0.1.92"
bytes = "=1.11.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
tokio = { version = "=1.53.3", features = ["time", "rt", "sync"] }
tokio-postgres = "=0.7.18"

[dev-dependencies]
bee-testkit = { path = "../bee-testkit" }
tokio = { version = "=1.53.3", features = ["time", "rt", "rt-multi-thread", "macros", "sync"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
