[package]
name = "bee-daemon"
description = "Per-node object cache shared by jobs on one machine (run as `bee daemon`), and the regional cache tier."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bee-daemon"
path = "src/main.rs"

[dependencies]
bee-core = { path = "../bee-core" }
bee-object = { path = "../bee-object" }
bee-proto = { path = "../bee-proto" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "=1.11.0"
futures-util = { version = "=0.3.31", default-features = false, features = ["std"] }
http = "=1.3.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
notify = "=8.2.0"
pbjson-types = "=0.9.0"
prost = "=0.14.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
toml = "=1.1.8"
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "transport"] }

[dev-dependencies]
bee-server = { path = "../bee-server" }
base64 = "=0.22.1"
bee-wc = { path = "../bee-wc" }
tempfile = "=3.27.0"

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
