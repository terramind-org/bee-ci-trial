[package]
name = "bee-proto"
description = "Generated protobuf/Connect types for bee.v1 and conversions to domain types."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-core = { path = "../bee-core" }
bee-object = { path = "../bee-object" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
base64 = "=0.22.1"
bytes = "=1.11.0"
futures-util = { version = "=0.3.31", default-features = false, features = ["std"] }
http = "=1.3.1"
http-body = "=1.0.1"
http-body-util = "=0.1.3"
pbjson = "=0.9.0"
pbjson-types = "=0.9.0"
prost = "=0.14.4"
prost-types = "=0.14.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
tonic-prost = "=0.14.6"
tower = { version = "=0.5.2", default-features = false, features = ["util"] }

[build-dependencies]
pbjson-build = "=0.9.0"
prost = "=0.14.4"
prost-build = "=0.14.4"
prost-types = "=0.14.4"
protoc-bin-vendored = "=3.3.0"
tonic-prost-build = "=0.14.6"

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-stream = "=0.1.17"

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
