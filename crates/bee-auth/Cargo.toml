[package]
name = "bee-auth"
description = "Principals, delegated budgeted tokens, GitHub/OIDC login, service identities."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-policy = { path = "../bee-policy" }
biscuit-auth = { version = "=6.0.0", default-features = false, features = ["datalog-macro"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
subtle = "=2.6.1"

[dev-dependencies]
proptest = "=1.12.0"

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
