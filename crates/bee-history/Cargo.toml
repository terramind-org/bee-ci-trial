[package]
name = "bee-history"
description = "Changeset graph: ancestry, merge-base, log, path history."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-core = { path = "../bee-core" }
bee-object = { path = "../bee-object" }
bee-store = { path = "../bee-store" }
bee-merge = { path = "../bee-merge" }
async-trait = "=0.1.92"

[dev-dependencies]
bee-testkit = { path = "../bee-testkit" }
tokio = { version = "=1.53.3", features = ["time", "rt", "rt-multi-thread", "macros", "sync"] }
proptest = "=1.12.0"

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
