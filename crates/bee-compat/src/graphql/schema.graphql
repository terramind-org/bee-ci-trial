interface Node { id: ID! }
interface Actor { avatarUrl(size: Int): URI! login: String! resourcePath: URI! url: URI! }
interface RepositoryOwner { id: ID! login: String! url: URI! avatarUrl(size: Int): URI! resourcePath: URI! repository(name: String!, followRenames: Boolean): Repository repositories(first: Int, after: String, last: Int, before: String, privacy: RepositoryPrivacy, ownerAffiliations: [RepositoryAffiliation], orderBy: RepositoryOrder, isFork: Boolean, isArchived: Boolean): RepositoryConnection! }
interface UniformResourceLocatable { resourcePath: URI! url: URI! }
interface Closable { closed: Boolean! closedAt: DateTime }
interface Comment { id: ID! author: Actor authorAssociation: CommentAuthorAssociation! body: String! bodyText: String! createdAt: DateTime! }
interface Labelable { labels(first: Int, after: String, last: Int, before: String, orderBy: LabelOrder): LabelConnection }
interface Assignable { assignees(first: Int, after: String, last: Int, before: String): UserConnection! }
interface Lockable { locked: Boolean! activeLockReason: LockReason }
interface Reactable { id: ID! reactionGroups: [ReactionGroup!] }
interface Starrable { id: ID! stargazerCount: Int! viewerHasStarred: Boolean! }
interface GitObject { id: ID! oid: GitObjectID! abbreviatedOid: String! commitUrl: URI! repository: Repository! }
interface RepositoryNode { repository: Repository! }

union StatusCheckRollupContext = CheckRun | StatusContext
union IssueOrPullRequest = Issue | PullRequest
union SearchResultItem = Issue | PullRequest | Repository | User | Organization
union RequestedReviewer = User | Team | Bot
union Assignee = User | Bot
union ProjectV2ItemContent = Issue | PullRequest

type Query {
  viewer: User!
  repository(owner: String!, name: String!, followRenames: Boolean): Repository
