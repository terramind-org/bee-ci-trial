[package]
name = "bee-compat"
description = "GitHub REST and GraphQL compatibility gateway over the Beehive forge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true

[dependencies]
bee-auth = { path = "../bee-auth" }
bee-core = { path = "../bee-core" }
bee-forge = { path = "../bee-forge" }
bee-git = { path = "../bee-git" }
bee-history = { path = "../bee-history" }
bee-object = { path = "../bee-object" }
bee-policy = { path = "../bee-policy" }
bee-proto = { path = "../bee-proto" }
bee-store = { path = "../bee-store" }
# Ports (the VCS, tokens, uploads, state) are async object-safe traits like the forge hooks.
async-trait = "=0.1.92"
# The gateway is an axum router the server merges into its single listener.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
# Basic credentials, file contents and GraphQL node ids are base64.
base64 = "=0.22.1"
# Numeric ids and ETags are BLAKE3 digests of stable inputs.
blake3 = "=1.8.7"
bytes = "=1.11.0"
# Sealed boxes for Actions secrets: X25519 (libsodium's crypto_box_seal), already in the lockfile.
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["zeroize"] }
http = "=1.3.1"
http-body-util = "=0.1.3"
pbjson-types = "=0.9.0"
# The Poly1305 authenticator of the sealed box, already in the lockfile.
poly1305 = "=0.9.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Git blob ids for the contents API and release asset digests.
sha2 = "=0.10.9"
tokio = { version = "=1.53.3", features = ["sync"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "transport"] }

[dev-dependencies]
# The opt-in gh test runs against the real server with the gateway mounted.
bee-server = { path = "../bee-server" }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "process", "time", "sync"] }
tower = { version = "=0.5.2", default-features = false, features = ["util"] }
