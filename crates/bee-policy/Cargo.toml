[package]
name = "bee-policy"
description = "Policy-as-code: path/ref ACLs, landing rules, review requirements."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
blake3 = "=1.8.7"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"

[dev-dependencies]
proptest = "=1.12.0"

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
