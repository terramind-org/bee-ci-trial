[package]
name = "bee-store-blob"
description = "Blob store on S3-compatible object storage and local disk."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

[dependencies]
bee-core = { path = "../bee-core" }
bee-object = { path = "../bee-object" }
bee-store = { path = "../bee-store" }
async-trait = "=0.1.92"
bytes = "=1.11.0"
getrandom = "=0.4.3"
hmac = "=0.12.1"
http = "=1.3.1"
http-body-util = "=0.1.3"
hyper = "=1.12.0"
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
sha2 = "=0.10.9"
tokio = { version = "=1.53.3", features = ["time", "rt", "sync"] }
zstd = { version = "=0.13.3", default-features = false }

[dev-dependencies]
bee-testkit = { path = "../bee-testkit" }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["time", "rt", "rt-multi-thread", "macros", "sync", "net", "io-util"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
