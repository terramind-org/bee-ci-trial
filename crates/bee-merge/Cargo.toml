[package]
name = "bee-merge"
description = "Line diff, three-way merge and structured conflicts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One test program per crate (tests/main.rs); see its header.
autotests = false

# Layer 1 and deliberately self-contained: no dependency on other bee crates. Callers adapt
# object types to the small input types defined here.
[dependencies]

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "perf"
path = "tests/perf.rs"

[lints]
workspace = true
