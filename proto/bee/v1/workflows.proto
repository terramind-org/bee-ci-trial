// Request for GetWorkflowRunUsage.
message GetWorkflowRunUsageRequest {
  RepoRef repo = 1;
  string run_id = 2;
}

// Time one job used.
message WorkflowJobUsage {
  string job_id = 1;
  string machine_class = 2;
  uint64 duration_ms = 3;
  uint64 billable_ms = 4;
}

// Time used by one run.
message WorkflowRunUsage {
  string run_id = 1;
  uint64 run_duration_ms = 2;
  repeated WorkflowRunnerUsage runners = 3;
  repeated WorkflowJobUsage jobs = 4;
}

// ---------- Jobs ----------

// One step of a job.
message WorkflowStep {
  uint32 number = 1;
  string name = 2;
  WorkflowStatus status = 3;
  WorkflowConclusion conclusion = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  uint64 log_offset = 7; // byte offset in the job log where this step starts
}

// One job of a run attempt.
message WorkflowJob {
  string id = 1;
  string run_id = 2;
  uint32 run_attempt = 3;
  string name = 4;           // includes matrix values, e.g. "test (ubuntu, 22)"
  string workflow_name = 5;
  WorkflowStatus status = 6;
  WorkflowConclusion conclusion = 7;
  repeated WorkflowStep steps = 8;
  repeated string labels = 9; // `runs-on` labels
  string runner_id = 10;
  string runner_name = 11;
  string runner_group_id = 12;
  string machine_class = 13;  // hosted class, empty for self-hosted
  string check_run_id = 14;   // CheckService run carrying annotations and output
  string head_ref = 15;
  ObjectId head_changeset = 16;
  string matrix_json = 17;    // JSON object of this job's matrix values
  repeated string needs = 18;
  string environment = 19;
  uint64 log_size_bytes = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp started_at = 22;
  google.protobuf.Timestamp completed_at = 23;
}

// Which attempts ListWorkflowJobs returns.
enum WorkflowJobAttemptFilter {
  WORKFLOW_JOB_ATTEMPT_FILTER_UNSPECIFIED = 0; // same as LATEST
  WORKFLOW_JOB_ATTEMPT_FILTER_LATEST = 1;
  WORKFLOW_JOB_ATTEMPT_FILTER_ALL = 2;
}

// Request for ListWorkflowJobs.
message ListWorkflowJobsRequest {
  RepoRef repo = 1;
  string run_id = 2;
  uint32 attempt = 3; // 0 = use `filter`
  WorkflowJobAttemptFilter filter = 4;
  PageRequest page = 5;
}

// Response for ListWorkflowJobs.
message ListWorkflowJobsResponse {
  repeated WorkflowJob jobs = 1;
  PageResponse page = 2;
}

// Request for GetWorkflowJob.
message GetWorkflowJobRequest {
  RepoRef repo = 1;
  string job_id = 2;
}

// Request for GetWorkflowJobSummary.
message GetWorkflowJobSummaryRequest {
  RepoRef repo = 1;
  string job_id = 2;
}

// Markdown a job wrote to its step summary.
message WorkflowJobSummary {
  string job_id = 1;
  string markdown = 2;
  bool truncated = 3; // over the 1 MiB summary limit
}

// ---------- Logs ----------

// Request for TailWorkflowJobLogs.
message TailWorkflowJobLogsRequest {
  RepoRef repo = 1;
  string job_id = 2;
  uint64 offset = 3;    // resume from this byte offset
  bool follow = 4;      // keep the stream open for live output until the job ends
  uint32 step_number = 5; // 0 = whole job
}

// A slice of a job log.
message WorkflowLogChunk {
  uint64 offset = 1; // byte offset of `data` in the job log
  bytes data = 2;    // UTF-8 text, at most 1 MiB
  uint32 step_number = 3;
  bool eof = 4;      // the job completed and no more bytes will follow
}

// Request for GetWorkflowJobLogsUrl.
message GetWorkflowJobLogsUrlRequest {
  RepoRef repo = 1;
  string job_id = 2;
}

// Request for GetWorkflowRunLogsUrl.
message GetWorkflowRunLogsUrlRequest {
  RepoRef repo = 1;
  string run_id = 2;
  uint32 attempt = 3; // 0 = latest
}

// A short-lived signed URL for log download.
message WorkflowLogsUrl {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Request for DeleteWorkflowRunLogs.
message DeleteWorkflowRunLogsRequest {
  RepoRef repo = 1;
  string run_id = 2;
}

// Response for DeleteWorkflowRunLogs.
message DeleteWorkflowRunLogsResponse {}

// ---------- Artifacts ----------

// A file or archive a job uploaded.
message WorkflowArtifact {
  string id = 1;
  RepoRef repo = 2;
  string name = 3;
  uint64 size_bytes = 4;
  string digest = 5;   // "sha256:<hex>"
  bool archive = 6;    // true = zip archive; false = a single unzipped file
  string content_type = 7;
  string run_id = 8;
  string job_id = 9;
  string head_ref = 10;
  ObjectId head_changeset = 11;
  uint32 retention_days = 12;
  bool expired = 13;
  bool finalized = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  google.protobuf.Timestamp expires_at = 17;
}

// Request for ListWorkflowArtifacts.
message ListWorkflowArtifactsRequest {
  RepoRef repo = 1;
  string run_id = 2; // empty = whole repo
  string name = 3;
  PageRequest page = 4;
}

// Response for ListWorkflowArtifacts.
message ListWorkflowArtifactsResponse {
  repeated WorkflowArtifact artifacts = 1;
  PageResponse page = 2;
}

// Request for GetWorkflowArtifact.
message GetWorkflowArtifactRequest {
  RepoRef repo = 1;
  string artifact_id = 2;
}

// Request for DeleteWorkflowArtifact.
message DeleteWorkflowArtifactRequest {
  RepoRef repo = 1;
  string artifact_id = 2;
}

// Response for DeleteWorkflowArtifact.
message DeleteWorkflowArtifactResponse {}

// Request for GetWorkflowArtifactDownloadUrl.
message GetWorkflowArtifactDownloadUrlRequest {
