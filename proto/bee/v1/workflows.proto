  string artifact_id = 2;
}

// Response for GetWorkflowArtifactDownloadUrl.
message GetWorkflowArtifactDownloadUrlResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Request for CreateWorkflowArtifactUpload.
message CreateWorkflowArtifactUploadRequest {
  RepoRef repo = 1;
  string job_id = 2;
  string name = 3;
  bool archive = 4;
  string content_type = 5;
  uint32 retention_days = 6; // 0 = repo default; capped by policy
}

// Response for CreateWorkflowArtifactUpload.
message CreateWorkflowArtifactUploadResponse {
  string artifact_id = 1;
  string upload_url = 2;
  repeated KeyValue upload_headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// Request for FinalizeWorkflowArtifact.
message FinalizeWorkflowArtifactRequest {
  RepoRef repo = 1;
  string artifact_id = 2;
  uint64 size_bytes = 3;
  string digest = 4; // "sha256:<hex>"
}

// ---------- Caches ----------

// One `actions/cache` entry. Entries are scoped by ref: a job reads its own ref's entries,
// then its base ref's, then the default ref's.
message WorkflowCache {
  string id = 1;
  string key = 2;
  string version = 3; // hash of paths and compression, set by the cache client
  string ref = 4;
  uint64 size_bytes = 5;
  bool committed = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_accessed_at = 8;
}

// Sort order for ListWorkflowCaches.
enum WorkflowCacheSort {
  WORKFLOW_CACHE_SORT_UNSPECIFIED = 0; // last accessed, newest first
  WORKFLOW_CACHE_SORT_LAST_ACCESSED = 1;
  WORKFLOW_CACHE_SORT_CREATED = 2;
  WORKFLOW_CACHE_SORT_SIZE = 3;
}

// Request for ListWorkflowCaches.
message ListWorkflowCachesRequest {
  RepoRef repo = 1;
  string key_prefix = 2;
  string ref = 3;
  WorkflowCacheSort sort = 4;
  PageRequest page = 5;
}

// Response for ListWorkflowCaches.
message ListWorkflowCachesResponse {
  repeated WorkflowCache caches = 1;
  PageResponse page = 2;
}

// Request for DeleteWorkflowCaches.
message DeleteWorkflowCachesRequest {
  RepoRef repo = 1;
  string cache_id = 2; // delete one entry, or
  string key = 3;      // delete every entry with this key
  string ref = 4;      // with `key`: only on this ref
}

// Response for DeleteWorkflowCaches.
message DeleteWorkflowCachesResponse {
  uint32 deleted_count = 1;
}

// Request for GetWorkflowCacheUsage.
message GetWorkflowCacheUsageRequest {
  RepoRef repo = 1;
}

// Cache storage of one repo.
message WorkflowCacheUsage {
  RepoRef repo = 1;
  uint64 active_size_bytes = 2;
  uint64 active_count = 3;
  uint64 limit_bytes = 4;
}

// Request for ListWorkflowCacheUsageByRepo.
message ListWorkflowCacheUsageByRepoRequest {
  string org = 1;
  PageRequest page = 2;
}

// Response for ListWorkflowCacheUsageByRepo.
message ListWorkflowCacheUsageByRepoResponse {
  repeated WorkflowCacheUsage usages = 1;
  PageResponse page = 2;
  uint64 total_size_bytes = 3;
}

// Request for LookupWorkflowCache.
message LookupWorkflowCacheRequest {
  RepoRef repo = 1;
  string job_id = 2;  // determines the ref scope searched
  string key = 3;
  string version = 4;
  repeated string restore_keys = 5; // prefix fallbacks, in order
}

// Response for LookupWorkflowCache.
message LookupWorkflowCacheResponse {
  WorkflowCache cache = 1;
  bool exact_match = 2; // matched `key` rather than a restore key
  string download_url = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// Request for ReserveWorkflowCache.
message ReserveWorkflowCacheRequest {
  RepoRef repo = 1;
  string job_id = 2;
  string key = 3;
  string version = 4;
  uint64 size_bytes = 5; // expected size, for quota
}

// Response for ReserveWorkflowCache.
message ReserveWorkflowCacheResponse {
  string cache_id = 1;
  string upload_url = 2;
  repeated KeyValue upload_headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// Request for CommitWorkflowCache.
message CommitWorkflowCacheRequest {
  RepoRef repo = 1;
  string cache_id = 2;
  uint64 size_bytes = 3;
  string digest = 4; // "sha256:<hex>"
}

// ---------- Actions policies ----------

// Whether a policy is read or written at org or repo level.
enum ActionsPolicyScopeKind {
  ACTIONS_POLICY_SCOPE_KIND_UNSPECIFIED = 0;
  ACTIONS_POLICY_SCOPE_KIND_ORG = 1;
  ACTIONS_POLICY_SCOPE_KIND_REPO = 2;
}

// Names the org or repo an actions policy applies to.
message ActionsPolicyScope {
  ActionsPolicyScopeKind kind = 1;
  string org = 2;
  RepoRef repo = 3;
}

// Which repos of an org may run workflows.
enum ActionsPolicyEnabledRepos {
  ACTIONS_POLICY_ENABLED_REPOS_UNSPECIFIED = 0;
  ACTIONS_POLICY_ENABLED_REPOS_ALL = 1;
  ACTIONS_POLICY_ENABLED_REPOS_SELECTED = 2;
  ACTIONS_POLICY_ENABLED_REPOS_NONE = 3;
}

// Which `uses:` actions and reusable workflows may run.
enum ActionsPolicyAllowedActions {
  ACTIONS_POLICY_ALLOWED_ACTIONS_UNSPECIFIED = 0;
  ACTIONS_POLICY_ALLOWED_ACTIONS_ALL = 1;
  ACTIONS_POLICY_ALLOWED_ACTIONS_LOCAL_ONLY = 2; // actions in the same org only
  ACTIONS_POLICY_ALLOWED_ACTIONS_SELECTED = 3;   // local plus the allow rules below
}

// Which outside contributors need approval before their runs start.
enum ActionsPolicyForkApproval {
  ACTIONS_POLICY_FORK_APPROVAL_UNSPECIFIED = 0;
  ACTIONS_POLICY_FORK_APPROVAL_FIRST_TIME_NEW_ACCOUNTS = 1; // first-time contributors new to the forge
  ACTIONS_POLICY_FORK_APPROVAL_FIRST_TIME_CONTRIBUTORS = 2;
  ACTIONS_POLICY_FORK_APPROVAL_ALL_EXTERNAL = 3;
}

// Default permission of the job token.
enum ActionsPolicyTokenPermission {
  ACTIONS_POLICY_TOKEN_PERMISSION_UNSPECIFIED = 0;
  ACTIONS_POLICY_TOKEN_PERMISSION_READ = 1;
  ACTIONS_POLICY_TOKEN_PERMISSION_WRITE = 2;
}

// A list of action patterns, wrapped so an update can tell "unchanged" from "empty".
message ActionsPolicyPatterns {
  repeated string patterns = 1; // e.g. "octo-org/*", "actions/checkout@*"
}

// Actions settings of an org or repo. On a repo, fields the org enforces are reported as the
// effective value and `org_enforced` lists their names.
message ActionsPolicy {
  ActionsPolicyScope scope = 1;
  bool enabled = 2;                             // repo: workflows may run
  ActionsPolicyEnabledRepos enabled_repos = 3;  // org only
  ActionsPolicyAllowedActions allowed_actions = 4;
  bool verified_creators_allowed = 5;           // with SELECTED: actions by verified creators
  repeated string allowed_patterns = 6;         // with SELECTED
  bool sha_pinning_required = 7;                // `uses:` must pin a full commit id
  ActionsPolicyForkApproval fork_approval = 8;
  bool agent_runs_require_approval = 9;         // runs for agent-authored CRs need a human approval
  bool fork_runs_on_private = 10;               // run workflows from fork CRs on private repos
  bool fork_send_write_tokens = 11;
  bool fork_send_secrets = 12;
  bool fork_require_approval_private = 13;
  ActionsPolicyTokenPermission default_token_permission = 14;
  bool token_can_approve_change_requests = 15;
  uint32 artifact_retention_days = 16;
  uint32 log_retention_days = 17;
  uint64 cache_max_size_bytes = 18;
  uint32 cache_retention_days = 19;
  repeated string org_enforced = 20;            // output only
}

// Request for GetActionsPolicy.
message GetActionsPolicyRequest {
  ActionsPolicyScope scope = 1;
}

// Request for SetActionsPolicy.
message SetActionsPolicyRequest {
  ActionsPolicyScope scope = 1;
  optional bool enabled = 2;
  optional ActionsPolicyEnabledRepos enabled_repos = 3;
  optional ActionsPolicyAllowedActions allowed_actions = 4;
  optional bool verified_creators_allowed = 5;
  ActionsPolicyPatterns allowed_patterns = 6; // unset = unchanged
  optional bool sha_pinning_required = 7;
  optional ActionsPolicyForkApproval fork_approval = 8;
  optional bool agent_runs_require_approval = 9;
  optional bool fork_runs_on_private = 10;
  optional bool fork_send_write_tokens = 11;
  optional bool fork_send_secrets = 12;
  optional bool fork_require_approval_private = 13;
  optional ActionsPolicyTokenPermission default_token_permission = 14;
  optional bool token_can_approve_change_requests = 15;
  optional uint32 artifact_retention_days = 16;
  optional uint32 log_retention_days = 17;
  optional uint64 cache_max_size_bytes = 18;
  optional uint32 cache_retention_days = 19;
}

// Request for ListActionsPolicyEnabledRepos.
message ListActionsPolicyEnabledReposRequest {
  string org = 1;
  PageRequest page = 2;
}

// Response for ListActionsPolicyEnabledRepos.
message ListActionsPolicyEnabledReposResponse {
  repeated RepoRef repos = 1;
  PageResponse page = 2;
}

// Request for SetActionsPolicyEnabledRepos.
message SetActionsPolicyEnabledReposRequest {
  string org = 1;
  repeated RepoRef repos = 2;
}

// Response for SetActionsPolicyEnabledRepos.
message SetActionsPolicyEnabledReposResponse {}

// ---------- Required workflows ----------

// Which repos a required workflow applies to.
enum WorkflowRequirementScope {
  WORKFLOW_REQUIREMENT_SCOPE_UNSPECIFIED = 0;
  WORKFLOW_REQUIREMENT_SCOPE_ALL = 1;
  WORKFLOW_REQUIREMENT_SCOPE_SELECTED = 2;
}

// A workflow an org requires to run, and pass, on its repos' change requests.
message WorkflowRequirement {
  string id = 1;
  string org = 2;
  string name = 3;
  RepoRef source_repo = 4;
  string source_path = 5;
  string source_ref = 6; // empty = source repo's default ref
  WorkflowRequirementScope scope = 7;
  repeated RepoRef selected_repos = 8;
  bool enforced = 9;     // false = evaluate only
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// Request for ListRequiredWorkflows.
message ListRequiredWorkflowsRequest {
  string org = 1;
  PageRequest page = 2;
}

// Response for ListRequiredWorkflows.
message ListRequiredWorkflowsResponse {
  repeated WorkflowRequirement workflows = 1;
  PageResponse page = 2;
}

// Request for CreateRequiredWorkflow.
message CreateRequiredWorkflowRequest {
  string org = 1;
  string name = 2;
  RepoRef source_repo = 3;
  string source_path = 4;
  string source_ref = 5;
  WorkflowRequirementScope scope = 6;
  repeated RepoRef selected_repos = 7;
  bool enforced = 8;
}

// The full selected repo set, wrapped so an update can tell "unchanged" from "empty".
message WorkflowRequirementRepos {
  repeated RepoRef repos = 1;
}

// Request for UpdateRequiredWorkflow.
message UpdateRequiredWorkflowRequest {
  string org = 1;
  string required_workflow_id = 2;
  optional string name = 3;
  optional string source_path = 4;
  optional string source_ref = 5;
  optional WorkflowRequirementScope scope = 6;
  WorkflowRequirementRepos selected_repos = 7; // unset = unchanged
  optional bool enforced = 8;
}

// Request for DeleteRequiredWorkflow.
message DeleteRequiredWorkflowRequest {
  string org = 1;
  string required_workflow_id = 2;
}

// Response for DeleteRequiredWorkflow.
message DeleteRequiredWorkflowResponse {}

// ---------- OIDC ----------

// Request for CreateWorkflowOidcToken.
message CreateWorkflowOidcTokenRequest {
  RepoRef repo = 1;
  string job_id = 2;
  string audience = 3; // `aud` claim; empty = the repo owner's URL
}

// Response for CreateWorkflowOidcToken.
message CreateWorkflowOidcTokenResponse {
  string token = 1; // signed JWT
  google.protobuf.Timestamp expires_at = 2;
}

// Request for GetWorkflowOidcClaimTemplate.
message GetWorkflowOidcClaimTemplateRequest {
  ActionsPolicyScope scope = 1;
}

// How the OIDC `sub` claim is composed.
message WorkflowOidcClaimTemplate {
  ActionsPolicyScope scope = 1;
  bool use_default = 2;                    // repo: inherit from org or platform default
  repeated string include_claim_keys = 3;  // e.g. "repo", "context", "job_workflow_ref"
}

// Request for SetWorkflowOidcClaimTemplate.
message SetWorkflowOidcClaimTemplateRequest {
  ActionsPolicyScope scope = 1;
  bool use_default = 2;
  repeated string include_claim_keys = 3;
}

// ---------- Attestations ----------

// An artifact an attestation is about.
message AttestationSubject {
  string name = 1;   // e.g. image reference or file name
  string digest = 2; // "sha256:<hex>"
}

// A signed in-toto statement about built artifacts (Sigstore bundle).
message Attestation {
  string id = 1;
  RepoRef repo = 2;
  repeated AttestationSubject subjects = 3;
  string predicate_type = 4; // e.g. "https://slsa.dev/provenance/v1"
  string predicate_json = 5; // JSON
  string bundle_json = 6;    // Sigstore bundle, JSON
  string workflow_run_id = 7;
  string job_id = 8;
  string workflow_path = 9;
  string source_ref = 10;
  ObjectId source_changeset = 11;
  string signer_identity = 12; // certificate SAN, e.g. the signer workflow ref
  Provenance provenance = 13;  // agent provenance of the source changeset, when present
  google.protobuf.Timestamp created_at = 14;
}

// Request for CreateAttestation.
message CreateAttestationRequest {
  RepoRef repo = 1;
  string job_id = 2;
  repeated AttestationSubject subjects = 3;
  string predicate_type = 4;
  string predicate_json = 5; // JSON; empty with SLSA type = server-generated build provenance
}

// Request for ListAttestations.
message ListAttestationsRequest {
  RepoRef repo = 1;     // or
  string org = 2;       // list across an org
  string subject_digest = 3;
  string predicate_type = 4;
  PageRequest page = 5;
}

// Response for ListAttestations.
message ListAttestationsResponse {
  repeated Attestation attestations = 1;
  PageResponse page = 2;
}

// Request for VerifyAttestation.
message VerifyAttestationRequest {
  RepoRef repo = 1;     // or
  string org = 2;
  string subject_digest = 3;
  string predicate_type = 4;
  string expected_signer_workflow = 5; // e.g. "org/repo/.github/workflows/release.yml"
  string expected_source_ref = 6;
}

// Response for VerifyAttestation.
message VerifyAttestationResponse {
  bool verified = 1;
  repeated Attestation attestations = 2; // the ones that verified
  repeated string failures = 3;          // why others did not
}

// Request for DeleteAttestation.
message DeleteAttestationRequest {
  RepoRef repo = 1;
  string attestation_id = 2;
}

// Response for DeleteAttestation.
message DeleteAttestationResponse {}

// ---------- Runners ----------

// Whether a runner resource belongs to a repo or an org.
enum RunnerScopeKind {
  RUNNER_SCOPE_KIND_UNSPECIFIED = 0;
  RUNNER_SCOPE_KIND_REPO = 1;
  RUNNER_SCOPE_KIND_ORG = 2;
}

// Names the repo or org that owns runners.
message RunnerScope {
  RunnerScopeKind kind = 1;
  string org = 2;
  RepoRef repo = 3;
}

// Connection state of a runner.
enum RunnerStatus {
  RUNNER_STATUS_UNSPECIFIED = 0;
  RUNNER_STATUS_ONLINE = 1;
  RUNNER_STATUS_OFFLINE = 2;
}

// Operating system of a runner or machine class.
enum RunnerOs {
  RUNNER_OS_UNSPECIFIED = 0;
  RUNNER_OS_LINUX = 1;
  RUNNER_OS_MACOS = 2;
  RUNNER_OS_WINDOWS = 3;
}

// CPU architecture of a runner or machine class.
enum RunnerArch {
  RUNNER_ARCH_UNSPECIFIED = 0;
  RUNNER_ARCH_X64 = 1;
  RUNNER_ARCH_ARM64 = 2;
}

// Whether a label was set by the runner software or by a user.
enum RunnerLabelKind {
  RUNNER_LABEL_KIND_UNSPECIFIED = 0;
  RUNNER_LABEL_KIND_DEFAULT = 1; // e.g. "self-hosted", "linux", "x64"
  RUNNER_LABEL_KIND_CUSTOM = 2;
}

// A label `runs-on` can match.
message RunnerLabel {
  string name = 1;
  RunnerLabelKind kind = 2;
}

// A self-hosted or hosted runner.
message Runner {
  string id = 1;
  RunnerScope scope = 2;
  string name = 3;
  RunnerOs os = 4;
  RunnerArch arch = 5;
  RunnerStatus status = 6;
  bool busy = 7;
  bool ephemeral = 8;
  bool hosted = 9;
  bool native = 10;           // speaks the bee job protocol rather than actions/runner
  repeated RunnerLabel labels = 11;
  string runner_group_id = 12;
  string version = 13;        // runner software version
  string current_job_id = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp last_seen_at = 16;
}

// A short-lived runner registration or removal token.
message RunnerToken {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Request for CreateRunnerRegistrationToken.
message CreateRunnerRegistrationTokenRequest {
  RunnerScope scope = 1;
}

// Request for CreateRunnerRemoveToken.
message CreateRunnerRemoveTokenRequest {
  RunnerScope scope = 1;
}

// Request for CreateRunnerJitConfig.
message CreateRunnerJitConfigRequest {
  RunnerScope scope = 1;
  string name = 2;
  string runner_group_id = 3;
  repeated string labels = 4;
  string work_folder = 5;
}

// Response for CreateRunnerJitConfig.
message CreateRunnerJitConfigResponse {
  Runner runner = 1;
  string encoded_jit_config = 2; // pass to the runner's --jitconfig flag
}

// Request for RegisterRunner.
message RegisterRunnerRequest {
  string registration_token = 1;
  string name = 2;
  RunnerOs os = 3;
  RunnerArch arch = 4;
  repeated string labels = 5;
  string runner_group_id = 6;
  bool ephemeral = 7;
  string version = 8;
}

// Response for RegisterRunner.
message RegisterRunnerResponse {
  Runner runner = 1;
  string credential = 2; // runner-scoped token for the job protocol; keep secret
}

// Request for ListRunners.
message ListRunnersRequest {
  RunnerScope scope = 1;
  string runner_group_id = 2;
  string label = 3;
  RunnerStatus status = 4;
  string name = 5;
  PageRequest page = 6;
}

// Response for ListRunners.
message ListRunnersResponse {
  repeated Runner runners = 1;
  PageResponse page = 2;
}

// Request for GetRunner.
message GetRunnerRequest {
  RunnerScope scope = 1;
  string runner_id = 2;
}

// Request for DeleteRunner.
message DeleteRunnerRequest {
  RunnerScope scope = 1;
  string runner_id = 2;
  bool force = 3; // remove even while busy; the running job fails
}

// Response for DeleteRunner.
message DeleteRunnerResponse {}

// Request for AddRunnerLabels.
message AddRunnerLabelsRequest {
  RunnerScope scope = 1;
  string runner_id = 2;
  repeated string labels = 3;
}

// Request for RemoveRunnerLabel.
message RemoveRunnerLabelRequest {
  RunnerScope scope = 1;
  string runner_id = 2;
  string label = 3;
}

// Request for SetRunnerLabels.
message SetRunnerLabelsRequest {
  RunnerScope scope = 1;
  string runner_id = 2;
  repeated string labels = 3;
}

// ---------- Runner groups ----------

// Which repos may use a runner group.
enum RunnerGroupVisibility {
  RUNNER_GROUP_VISIBILITY_UNSPECIFIED = 0;
  RUNNER_GROUP_VISIBILITY_ALL = 1;
  RUNNER_GROUP_VISIBILITY_PRIVATE = 2; // private and internal repos
  RUNNER_GROUP_VISIBILITY_SELECTED = 3;
}

// A set of runners with shared access rules.
message RunnerGroup {
  string id = 1;
  string org = 2;
  string name = 3;
  bool is_default = 4;
  RunnerGroupVisibility visibility = 5;
  bool allows_public_repos = 6;
  bool restricted_to_workflows = 7;
  repeated string selected_workflows = 8; // "org/repo/.github/workflows/x.yml@ref" patterns
  string network_configuration_id = 9;    // hosted runners: private networking
  uint32 runner_count = 10;
  google.protobuf.Timestamp created_at = 11;
}

// Request for CreateRunnerGroup.
message CreateRunnerGroupRequest {
  string org = 1;
  string name = 2;
  RunnerGroupVisibility visibility = 3;
  repeated RepoRef selected_repos = 4;
  repeated string runner_ids = 5;
  bool allows_public_repos = 6;
  bool restricted_to_workflows = 7;
  repeated string selected_workflows = 8;
}

// Request for GetRunnerGroup.
message GetRunnerGroupRequest {
  string org = 1;
  string runner_group_id = 2;
}

// Request for ListRunnerGroups.
message ListRunnerGroupsRequest {
  string org = 1;
  RepoRef visible_to_repo = 2; // only groups this repo may use
  PageRequest page = 3;
}

// Response for ListRunnerGroups.
message ListRunnerGroupsResponse {
  repeated RunnerGroup groups = 1;
  PageResponse page = 2;
}

// The full selected workflow list, wrapped so an update can tell "unchanged" from "empty".
message RunnerGroupWorkflows {
  repeated string workflows = 1;
}

// Request for UpdateRunnerGroup.
message UpdateRunnerGroupRequest {
  string org = 1;
  string runner_group_id = 2;
  optional string name = 3;
  optional RunnerGroupVisibility visibility = 4;
  optional bool allows_public_repos = 5;
  optional bool restricted_to_workflows = 6;
  RunnerGroupWorkflows selected_workflows = 7; // unset = unchanged
  optional string network_configuration_id = 8;
}

// Request for DeleteRunnerGroup.
message DeleteRunnerGroupRequest {
  string org = 1;
  string runner_group_id = 2;
}

// Response for DeleteRunnerGroup.
message DeleteRunnerGroupResponse {}

// Request for ListRunnerGroupRepos.
message ListRunnerGroupReposRequest {
  string org = 1;
  string runner_group_id = 2;
  PageRequest page = 3;
}

// Response for ListRunnerGroupRepos.
message ListRunnerGroupReposResponse {
  repeated RepoRef repos = 1;
  PageResponse page = 2;
}

// Request for SetRunnerGroupRepos.
message SetRunnerGroupReposRequest {
  string org = 1;
  string runner_group_id = 2;
  repeated RepoRef repos = 3;
}

// Response for SetRunnerGroupRepos.
message SetRunnerGroupReposResponse {}

// Request for SetRunnerGroupRunners.
message SetRunnerGroupRunnersRequest {
  string org = 1;
  string runner_group_id = 2;
  repeated string runner_ids = 3;
}

// Response for SetRunnerGroupRunners.
message SetRunnerGroupRunnersResponse {}

// ---------- Hosted machine classes and images ----------

// A hosted runner size a job can request through `runs-on`.
message RunnerMachineClass {
  string id = 1;        // label to use in `runs-on`, e.g. "linux-arm64-8"
  RunnerOs os = 2;
  RunnerArch arch = 3;
  uint32 cpu_cores = 4;
  uint64 memory_bytes = 5;
  uint64 storage_bytes = 6;
  string gpu = 7;       // e.g. "nvidia-t4"; empty = none
  uint32 gpu_count = 8;
  uint64 per_minute_usd_micros = 9;
  bool static_ip_available = 10;
}

// Request for ListRunnerMachineClasses.
message ListRunnerMachineClassesRequest {
  string org = 1;
  RunnerOs os = 2; // UNSPECIFIED = all
  PageRequest page = 3;
}

// Response for ListRunnerMachineClasses.
message ListRunnerMachineClassesResponse {
  repeated RunnerMachineClass classes = 1;
  PageResponse page = 2;
}

// Where a runner image comes from.
enum RunnerImageSource {
  RUNNER_IMAGE_SOURCE_UNSPECIFIED = 0;
  RUNNER_IMAGE_SOURCE_PLATFORM = 1; // maintained by Beehive
  RUNNER_IMAGE_SOURCE_CUSTOM = 2;   // registered by the org
}

// An OS image hosted runners boot.
message RunnerImage {
  string id = 1;
  string name = 2;      // e.g. "ubuntu-24.04"
  RunnerImageSource source = 3;
  RunnerOs os = 4;
  RunnerArch arch = 5;
  string oci_reference = 6; // custom images: registry reference with digest
  uint64 size_bytes = 7;
  google.protobuf.Timestamp created_at = 8;
}

// Request for ListRunnerImages.
message ListRunnerImagesRequest {
  string org = 1;
  RunnerImageSource source = 2; // UNSPECIFIED = all
  PageRequest page = 3;
}

// Response for ListRunnerImages.
message ListRunnerImagesResponse {
  repeated RunnerImage images = 1;
  PageResponse page = 2;
}

// Request for CreateRunnerCustomImage.
message CreateRunnerCustomImageRequest {
  string org = 1;
  string name = 2;
  RunnerOs os = 3;
  RunnerArch arch = 4;
  string oci_reference = 5; // must be pinned by digest
}

// Request for DeleteRunnerCustomImage.
message DeleteRunnerCustomImageRequest {
  string org = 1;
  string image_id = 2;
}

// Response for DeleteRunnerCustomImage.
message DeleteRunnerCustomImageResponse {}

// ---------- Native job protocol ----------

// Request for AcquireRunnerJob.
message AcquireRunnerJobRequest {
  string runner_id = 1;     // caller authenticates with the runner credential
  repeated string labels = 2; // labels offered right now; empty = registered labels
  uint32 max_jobs = 3;      // concurrent jobs this runner accepts; 0 = 1
}

// A job handed to a native runner. Messages with no `job_id` are keep-alives.
message RunnerJobAssignment {
  string job_id = 1;
  string run_id = 2;
  RepoRef repo = 3;
  string lease_id = 4;
  google.protobuf.Timestamp lease_expires_at = 5;
  string job_token = 6;          // scoped token for this job (checkout, artifacts, caches, OIDC)
  string plan_json = 7;          // resolved job: steps, env, matrix, services, container, JSON
  ObjectId head_changeset = 8;
  string head_ref = 9;
  uint32 timeout_seconds = 10;
  string secrets_url = 11;       // signed URL to fetch the job's sealed secrets once
}

// Request for RenewRunnerJob.
message RenewRunnerJobRequest {
  string runner_id = 1;
  string job_id = 2;
  string lease_id = 3;
}

// Response for RenewRunnerJob.
message RenewRunnerJobResponse {
  google.protobuf.Timestamp lease_expires_at = 1;
  bool cancel_requested = 2;   // stop the job and complete it as CANCELLED
  bool force_cancel = 3;       // stop without running `always()` steps
}

// Request for UpdateRunnerJobStep.
message UpdateRunnerJobStepRequest {
  string runner_id = 1;
  string job_id = 2;
  string lease_id = 3;
  uint32 step_number = 4;
  string step_name = 5;
  WorkflowStatus status = 6;
  WorkflowConclusion conclusion = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
}

// Response for UpdateRunnerJobStep.
message UpdateRunnerJobStepResponse {}

// Request for AppendRunnerJobLog.
message AppendRunnerJobLogRequest {
  string runner_id = 1;
  string job_id = 2;
  string lease_id = 3;
  uint64 offset = 4;  // byte offset where `data` starts
  bytes data = 5;     // at most 1 MiB
  uint32 step_number = 6;
}

// Response for AppendRunnerJobLog.
message AppendRunnerJobLogResponse {
  uint64 stored_end = 1; // next offset to write
}

// Request for CompleteRunnerJob.
message CompleteRunnerJobRequest {
  string runner_id = 1;
  string job_id = 2;
  string lease_id = 3;
  WorkflowConclusion conclusion = 4;
  repeated KeyValue outputs = 5;  // job outputs
  string summary_markdown = 6;    // step summary, at most 1 MiB
  google.protobuf.Timestamp completed_at = 7;
  // The evaluated `environment.url` of a job that deploys to an environment; recorded on the
  // final deployment status.
  string environment_url = 8;
}

// Response for CompleteRunnerJob.
message CompleteRunnerJobResponse {}

// Request for SearchWorkflowRunLogs.
message SearchWorkflowRunLogsRequest {
  RepoRef repo = 1;
  string run_id = 2;
  string query = 3;     // required
  uint32 limit = 4;     // default 100, at most 1000
}

// One matching log line.
message WorkflowLogMatch {
  string job_id = 1;
  string job_name = 2;
  uint64 line = 3;      // 1-based line in the job log
  string text = 4;
}

// Response for SearchWorkflowRunLogs.
message SearchWorkflowRunLogsResponse {
  repeated WorkflowLogMatch matches = 1;
}

// Request for GetWorkflowBadge.
message GetWorkflowBadgeRequest {
  RepoRef repo = 1;
  string workflow = 2;  // id, path or file name
  string branch = 3;    // empty = the default branch
}

// A status badge.
message WorkflowBadge {
  string label = 1;     // the workflow name
  string message = 2;   // "passing", "failing", "cancelled" or "no status"
  string color = 3;     // "#rrggbb"
  string svg = 4;       // the badge image
}

// Request for FetchRunnerJobSecrets.
message FetchRunnerJobSecretsRequest {
  string runner_id = 1;
  string job_id = 2;
  string lease_id = 3;
}

// Response for FetchRunnerJobSecrets.
message FetchRunnerJobSecretsResponse {
  repeated KeyValue secrets = 1;  // name -> value, by name
}
