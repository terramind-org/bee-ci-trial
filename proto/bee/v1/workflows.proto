}

// Response for DeleteWorkflowRun.
message DeleteWorkflowRunResponse {}

// Request for ApproveWorkflowRun.
message ApproveWorkflowRunRequest {
  RepoRef repo = 1;
  string run_id = 2;
}

// What a recorded run approval approved.
enum WorkflowApprovalKind {
  WORKFLOW_APPROVAL_KIND_UNSPECIFIED = 0;
  WORKFLOW_APPROVAL_KIND_RUN = 1;         // first-time contributor, fork or agent run approval
  WORKFLOW_APPROVAL_KIND_ENVIRONMENT = 2; // deployment review for an environment
}

// One approval or environment review recorded on a run.
message WorkflowRunApproval {
  WorkflowApprovalKind kind = 1;
  Principal approver = 2;
  DeploymentReviewDecision decision = 3; // APPROVED for kind RUN
  repeated string environments = 4;      // kind ENVIRONMENT
  string comment = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Request for ListWorkflowRunApprovals.
message ListWorkflowRunApprovalsRequest {
  RepoRef repo = 1;
  string run_id = 2;
