// Beehive workflow engine and runners for bee.v1 (PRODUCT §4.14).
// Workflows are `.github/workflows` YAML files run compatibly. Each job reports a CheckRun
// through CheckService, which carries annotations and output; this file references check runs
// by id only. The stock actions/runner protocol, the upload-artifact and actions/cache HTTP
// APIs used inside jobs are HTTP surfaces and are not modelled here; native bee runners use
// the RunnerService job RPCs below.
syntax = "proto3";

package bee.v1;

import "google/protobuf/timestamp.proto";
import "bee/v1/common.proto";
import "bee/v1/deployments.proto";

// Workflows, runs, jobs, logs, artifacts, caches, policies, OIDC and attestations.
service WorkflowService {
  // ----- Workflows -----

  // Lists workflows parsed from `.github/workflows` at a ref (default ref when unset).
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  // Returns one workflow by id or path, optionally with its YAML source. Errors: NOT_FOUND.
  rpc GetWorkflow(GetWorkflowRequest) returns (Workflow);
  // Parses and checks workflow YAML without landing it; returns diagnostics.
  rpc ValidateWorkflow(ValidateWorkflowRequest) returns (ValidateWorkflowResponse);
  // Enables a disabled workflow. Errors: NOT_FOUND.
  rpc EnableWorkflow(EnableWorkflowRequest) returns (Workflow);
  // Disables a workflow so no trigger starts it. Errors: NOT_FOUND.
  rpc DisableWorkflow(DisableWorkflowRequest) returns (Workflow);
  // Billable and wall time of a workflow's runs over the current billing period.
  rpc GetWorkflowUsage(GetWorkflowUsageRequest) returns (WorkflowUsage);

  // ----- Dispatch -----

  // Starts a workflow with a `workflow_dispatch` trigger. Errors: INVALID_ARGUMENT (subcode
  // `bad_input` for an undeclared or ill-typed input), INVALID_STATE (workflow disabled or no
  // workflow_dispatch trigger at the ref), QUOTA_EXCEEDED (minutes or concurrency limit).
  rpc DispatchWorkflow(DispatchWorkflowRequest) returns (DispatchWorkflowResponse);
  // Fires a `repository_dispatch` event that starts every workflow listening for its type.
  rpc CreateRepositoryDispatchEvent(CreateRepositoryDispatchEventRequest) returns (CreateRepositoryDispatchEventResponse);

  // ----- Runs -----

  // Lists runs, newest first, filtered by workflow, ref, event, status, actor or changeset.
  rpc ListWorkflowRuns(ListWorkflowRunsRequest) returns (ListWorkflowRunsResponse);
  // Returns the latest attempt of a run. Errors: NOT_FOUND.
  rpc GetWorkflowRun(GetWorkflowRunRequest) returns (WorkflowRun);
  // Returns one specific attempt of a run. Errors: NOT_FOUND.
  rpc GetWorkflowRunAttempt(GetWorkflowRunAttemptRequest) returns (WorkflowRun);
  // Streams state changes of a run and its jobs until the run completes.
  rpc WatchWorkflowRun(WatchWorkflowRunRequest) returns (stream WorkflowRunUpdate);
  // Cancels a run, honouring `if: always()` and cancellation steps. Errors: INVALID_STATE (completed).
  rpc CancelWorkflowRun(CancelWorkflowRunRequest) returns (CancelWorkflowRunResponse);
  // Cancels a run immediately, skipping `always()` conditions. Errors: INVALID_STATE.
  rpc ForceCancelWorkflowRun(ForceCancelWorkflowRunRequest) returns (ForceCancelWorkflowRunResponse);
  // Re-runs every job of a completed run as a new attempt. Errors: INVALID_STATE (not completed,
  // or older than the re-run window).
  rpc RerunWorkflowRun(RerunWorkflowRunRequest) returns (WorkflowRun);
  // Re-runs failed and cancelled jobs (and their dependents) as a new attempt. Errors: INVALID_STATE.
  rpc RerunFailedWorkflowJobs(RerunFailedWorkflowJobsRequest) returns (WorkflowRun);
  // Re-runs one job (and its dependents) as a new attempt. Errors: INVALID_STATE.
  rpc RerunWorkflowJob(RerunWorkflowJobRequest) returns (WorkflowRun);
  // Deletes a completed run with its logs and artifacts. Errors: INVALID_STATE (still running).
  rpc DeleteWorkflowRun(DeleteWorkflowRunRequest) returns (DeleteWorkflowRunResponse);
  // Approves a run held for a first-time contributor, fork change request or agent author.
  // Errors: INVALID_STATE (run not awaiting approval), PERMISSION_DENIED.
  rpc ApproveWorkflowRun(ApproveWorkflowRunRequest) returns (WorkflowRun);
  // Lists past run approvals and environment review decisions on a run.
  rpc ListWorkflowRunApprovals(ListWorkflowRunApprovalsRequest) returns (ListWorkflowRunApprovalsResponse);
  // Lists environments a run's jobs are waiting on for deployment review.
  rpc ListWorkflowRunPendingDeployments(ListWorkflowRunPendingDeploymentsRequest) returns (ListWorkflowRunPendingDeploymentsResponse);
  // Approves or rejects a run's pending deployments for the named environments.
  // Errors: PERMISSION_DENIED (not a required reviewer), INVALID_STATE (nothing pending).
  rpc ReviewWorkflowRunPendingDeployments(ReviewWorkflowRunPendingDeploymentsRequest) returns (ReviewWorkflowRunPendingDeploymentsResponse);
  // Billable and wall time of one run, per runner class and per job.
  rpc GetWorkflowRunUsage(GetWorkflowRunUsageRequest) returns (WorkflowRunUsage);

  // ----- Jobs -----

  // Lists the jobs of a run (latest attempt, or one attempt, or all attempts).
  rpc ListWorkflowJobs(ListWorkflowJobsRequest) returns (ListWorkflowJobsResponse);
  // Returns one job with its steps. Errors: NOT_FOUND.
  rpc GetWorkflowJob(GetWorkflowJobRequest) returns (WorkflowJob);
  // Returns a job's summary markdown (GITHUB_STEP_SUMMARY). Errors: NOT_FOUND.
  rpc GetWorkflowJobSummary(GetWorkflowJobSummaryRequest) returns (WorkflowJobSummary);

  // ----- Logs -----

  // Streams a job's log from a byte offset; follows live output until the job ends.
  // Reconnect with the last offset received to resume without gaps. Errors: NOT_FOUND,
  // REDACTED (logs deleted or expired).
  rpc TailWorkflowJobLogs(TailWorkflowJobLogsRequest) returns (stream WorkflowLogChunk);
  // Returns a short-lived signed URL for one job's complete log. Errors: NOT_FOUND, REDACTED.
  rpc GetWorkflowJobLogsUrl(GetWorkflowJobLogsUrlRequest) returns (WorkflowLogsUrl);
  // Returns a short-lived signed URL for a zip of all job logs of a run attempt.
  rpc GetWorkflowRunLogsUrl(GetWorkflowRunLogsUrlRequest) returns (WorkflowLogsUrl);
  // Deletes all logs of a run. Errors: INVALID_STATE (still running).
  rpc DeleteWorkflowRunLogs(DeleteWorkflowRunLogsRequest) returns (DeleteWorkflowRunLogsResponse);

  // ----- Artifacts -----

  // Lists artifacts of a repo or of one run, optionally by name.
  rpc ListWorkflowArtifacts(ListWorkflowArtifactsRequest) returns (ListWorkflowArtifactsResponse);
  // Returns one artifact's metadata. Errors: NOT_FOUND.
  rpc GetWorkflowArtifact(GetWorkflowArtifactRequest) returns (WorkflowArtifact);
  // Deletes an artifact. Errors: NOT_FOUND.
  rpc DeleteWorkflowArtifact(DeleteWorkflowArtifactRequest) returns (DeleteWorkflowArtifactResponse);
  // Returns a short-lived signed download URL. Errors: NOT_FOUND, INVALID_STATE (expired).
  rpc GetWorkflowArtifactDownloadUrl(GetWorkflowArtifactDownloadUrlRequest) returns (GetWorkflowArtifactDownloadUrlResponse);
  // Runner side: reserves an artifact for a job and returns a signed upload URL.
  // Errors: ALREADY_EXISTS (name taken in this run), QUOTA_EXCEEDED (storage).
  rpc CreateWorkflowArtifactUpload(CreateWorkflowArtifactUploadRequest) returns (CreateWorkflowArtifactUploadResponse);
  // Runner side: seals an uploaded artifact after checking size and digest. Errors: INTEGRITY.
  rpc FinalizeWorkflowArtifact(FinalizeWorkflowArtifactRequest) returns (WorkflowArtifact);

  // ----- Caches -----

  // Lists cache entries of a repo, filtered by key prefix or ref.
  rpc ListWorkflowCaches(ListWorkflowCachesRequest) returns (ListWorkflowCachesResponse);
  // Deletes cache entries by id, or by key (optionally limited to one ref).
  rpc DeleteWorkflowCaches(DeleteWorkflowCachesRequest) returns (DeleteWorkflowCachesResponse);
  // Cache storage used by one repo against its limit.
  rpc GetWorkflowCacheUsage(GetWorkflowCacheUsageRequest) returns (WorkflowCacheUsage);
  // Cache storage used by each repo of an org.
  rpc ListWorkflowCacheUsageByRepo(ListWorkflowCacheUsageByRepoRequest) returns (ListWorkflowCacheUsageByRepoResponse);
  // Runner side: finds the best cache entry for a key, version and restore keys, searching the
  // job's ref, then the base ref, then the default ref. Errors: NOT_FOUND (miss).
  rpc LookupWorkflowCache(LookupWorkflowCacheRequest) returns (LookupWorkflowCacheResponse);
  // Runner side: reserves a key+version on the job's ref and returns a signed upload URL.
  // Errors: ALREADY_EXISTS (entry exists or is being written), QUOTA_EXCEEDED.
  rpc ReserveWorkflowCache(ReserveWorkflowCacheRequest) returns (ReserveWorkflowCacheResponse);
  // Runner side: commits a reserved entry after upload. Errors: INTEGRITY, INVALID_STATE.
  rpc CommitWorkflowCache(CommitWorkflowCacheRequest) returns (WorkflowCache);

  // ----- Policies -----

  // Returns the actions policy of an org or repo, with values inherited from the org.
  rpc GetActionsPolicy(GetActionsPolicyRequest) returns (ActionsPolicy);
  // Updates an actions policy; unset fields are unchanged. Errors: POLICY_DENIED (a repo may
  // not loosen what its org enforces).
  rpc SetActionsPolicy(SetActionsPolicyRequest) returns (ActionsPolicy);
  // Lists repos where actions are enabled when the org policy uses SELECTED.
  rpc ListActionsPolicyEnabledRepos(ListActionsPolicyEnabledReposRequest) returns (ListActionsPolicyEnabledReposResponse);
  // Replaces the set of repos where actions are enabled. Errors: INVALID_STATE (not SELECTED).
  rpc SetActionsPolicyEnabledRepos(SetActionsPolicyEnabledReposRequest) returns (SetActionsPolicyEnabledReposResponse);

  // ----- Required workflows -----

  // Lists an org's required workflows.
  rpc ListRequiredWorkflows(ListRequiredWorkflowsRequest) returns (ListRequiredWorkflowsResponse);
  // Requires a workflow from a source repo to run on a set of repos. Errors: NOT_FOUND (file).
  rpc CreateRequiredWorkflow(CreateRequiredWorkflowRequest) returns (WorkflowRequirement);
  // Updates a required workflow. Errors: NOT_FOUND.
  rpc UpdateRequiredWorkflow(UpdateRequiredWorkflowRequest) returns (WorkflowRequirement);
  // Removes a required workflow. Errors: NOT_FOUND.
  rpc DeleteRequiredWorkflow(DeleteRequiredWorkflowRequest) returns (DeleteRequiredWorkflowResponse);

  // ----- OIDC -----

  // Issues an OIDC JWT for the calling job with GitHub-compatible claims. Callable only with
  // the job's token when the job has `id-token: write`. Errors: PERMISSION_DENIED.
  rpc CreateWorkflowOidcToken(CreateWorkflowOidcTokenRequest) returns (CreateWorkflowOidcTokenResponse);
  // Returns the OIDC subject claim template of an org or repo.
  rpc GetWorkflowOidcClaimTemplate(GetWorkflowOidcClaimTemplateRequest) returns (WorkflowOidcClaimTemplate);
  // Sets the OIDC subject claim template. Errors: INVALID_ARGUMENT (unknown claim key).
  rpc SetWorkflowOidcClaimTemplate(SetWorkflowOidcClaimTemplateRequest) returns (WorkflowOidcClaimTemplate);

  // ----- Attestations -----

  // Signs and stores an attestation for artifacts built by the calling job. Callable only with
  // the job's token when the job has `attestations: write`. Errors: PERMISSION_DENIED.
  rpc CreateAttestation(CreateAttestationRequest) returns (Attestation);
  // Lists attestations in a repo or org by subject digest.
  rpc ListAttestations(ListAttestationsRequest) returns (ListAttestationsResponse);
  // Verifies the attestations of a digest against expected signer and source.
  rpc VerifyAttestation(VerifyAttestationRequest) returns (VerifyAttestationResponse);
  // Deletes an attestation. Errors: NOT_FOUND.
  rpc DeleteAttestation(DeleteAttestationRequest) returns (DeleteAttestationResponse);

  // ----- Log search and badges -----

  // Lines of a run's job logs (latest attempt) containing a phrase, case-insensitive, in job
  // and line order. Needs `read`.
  rpc SearchWorkflowRunLogs(SearchWorkflowRunLogsRequest) returns (SearchWorkflowRunLogsResponse);
  // A workflow's status badge: the latest completed run on a branch, as text and SVG. Needs
  // `read`. Errors: NOT_FOUND (workflow).
  rpc GetWorkflowBadge(GetWorkflowBadgeRequest) returns (WorkflowBadge);
}

// Self-hosted and hosted runners, runner groups, machine classes, and the native job protocol.
service RunnerService {
  // ----- Registration -----

  // Creates a short-lived token a runner uses to register at a repo or org. Expires in 1 hour.
  rpc CreateRunnerRegistrationToken(CreateRunnerRegistrationTokenRequest) returns (RunnerToken);
  // Creates a short-lived token a runner uses to remove itself.
  rpc CreateRunnerRemoveToken(CreateRunnerRemoveTokenRequest) returns (RunnerToken);
  // Creates a just-in-time config for one ephemeral runner that takes a single job.
  rpc CreateRunnerJitConfig(CreateRunnerJitConfigRequest) returns (CreateRunnerJitConfigResponse);
  // Native runners: exchanges a registration token for a runner identity and credential.
  // Errors: TOKEN_EXPIRED, ALREADY_EXISTS (name taken in the scope).
  rpc RegisterRunner(RegisterRunnerRequest) returns (RegisterRunnerResponse);

  // ----- Runners -----

  // Lists runners at a repo or org, optionally by group, label or status.
  rpc ListRunners(ListRunnersRequest) returns (ListRunnersResponse);
  // Returns one runner. Errors: NOT_FOUND.
  rpc GetRunner(GetRunnerRequest) returns (Runner);
  // Force-removes a runner. Errors: NOT_FOUND, INVALID_STATE (busy, unless `force`).
  rpc DeleteRunner(DeleteRunnerRequest) returns (DeleteRunnerResponse);
  // Adds custom labels to a runner. Errors: NOT_FOUND.
  rpc AddRunnerLabels(AddRunnerLabelsRequest) returns (Runner);
  // Removes one custom label from a runner. Errors: NOT_FOUND.
  rpc RemoveRunnerLabel(RemoveRunnerLabelRequest) returns (Runner);
  // Replaces a runner's custom labels; default labels are kept.
  rpc SetRunnerLabels(SetRunnerLabelsRequest) returns (Runner);

  // ----- Groups -----

  // Creates a runner group in an org. Errors: ALREADY_EXISTS.
  rpc CreateRunnerGroup(CreateRunnerGroupRequest) returns (RunnerGroup);
  // Returns one runner group. Errors: NOT_FOUND.
  rpc GetRunnerGroup(GetRunnerGroupRequest) returns (RunnerGroup);
  // Lists an org's runner groups, optionally those a repo may use.
  rpc ListRunnerGroups(ListRunnerGroupsRequest) returns (ListRunnerGroupsResponse);
  // Updates a runner group's access rules. Errors: NOT_FOUND.
  rpc UpdateRunnerGroup(UpdateRunnerGroupRequest) returns (RunnerGroup);
  // Deletes a runner group; its runners move to the default group. Errors: INVALID_STATE (default group).
  rpc DeleteRunnerGroup(DeleteRunnerGroupRequest) returns (DeleteRunnerGroupResponse);
  // Lists repos allowed to use a group whose visibility is SELECTED.
  rpc ListRunnerGroupRepos(ListRunnerGroupReposRequest) returns (ListRunnerGroupReposResponse);
  // Replaces the repos allowed to use a group. Errors: INVALID_STATE (visibility not SELECTED).
  rpc SetRunnerGroupRepos(SetRunnerGroupReposRequest) returns (SetRunnerGroupReposResponse);
  // Replaces the runners in a group.
  rpc SetRunnerGroupRunners(SetRunnerGroupRunnersRequest) returns (SetRunnerGroupRunnersResponse);

  // ----- Hosted classes and images -----

  // Lists hosted runner machine classes available to an org.
  rpc ListRunnerMachineClasses(ListRunnerMachineClassesRequest) returns (ListRunnerMachineClassesResponse);
  // Lists runner images: platform images plus the org's custom images.
  rpc ListRunnerImages(ListRunnerImagesRequest) returns (ListRunnerImagesResponse);
  // Registers a custom runner image from an OCI reference. Errors: NOT_FOUND (image), QUOTA_EXCEEDED.
  rpc CreateRunnerCustomImage(CreateRunnerCustomImageRequest) returns (RunnerImage);
  // Deletes a custom runner image. Errors: INVALID_STATE (in use by a hosted pool).
  rpc DeleteRunnerCustomImage(DeleteRunnerCustomImageRequest) returns (DeleteRunnerCustomImageResponse);

  // ----- Native job protocol -----

  // Native runners: long-lived stream of job assignments for the calling runner. The server
  // sends an assignment when a matching job is queued; the runner must renew it before
  // `lease_expires_at`. Idle keep-alives arrive as messages with no job.
  rpc AcquireRunnerJob(AcquireRunnerJobRequest) returns (stream RunnerJobAssignment);
  // Native runners: heartbeat that extends the job lease and reports whether it was cancelled.
  // Errors: INVALID_STATE (lease lost; the runner must stop the job).
  rpc RenewRunnerJob(RenewRunnerJobRequest) returns (RenewRunnerJobResponse);
  // Native runners: reports a step's status change.
  rpc UpdateRunnerJobStep(UpdateRunnerJobStepRequest) returns (UpdateRunnerJobStepResponse);
  // Native runners: appends a log chunk (at most 1 MiB) at a byte offset; idempotent per offset.
  // Errors: INVALID_ARGUMENT (subcode `offset_gap` when offset is past the stored end), TOO_LARGE.
  rpc AppendRunnerJobLog(AppendRunnerJobLogRequest) returns (AppendRunnerJobLogResponse);
  // Native runners: completes a job with its conclusion and outputs.
  rpc CompleteRunnerJob(CompleteRunnerJobRequest) returns (CompleteRunnerJobResponse);
  // Native runners: the leased job's secrets, once (the RPC form of `secrets_url`). Errors:
  // PERMISSION_DENIED (already fetched, or the job is not running), INVALID_STATE (lease lost).
  rpc FetchRunnerJobSecrets(FetchRunnerJobSecretsRequest) returns (FetchRunnerJobSecretsResponse);
}

// ---------- Shared status ----------

// Lifecycle status of a run, job or step.
enum WorkflowStatus {
  WORKFLOW_STATUS_UNSPECIFIED = 0;
  WORKFLOW_STATUS_REQUESTED = 1;
  WORKFLOW_STATUS_PENDING = 2;          // waiting on a concurrency group
  WORKFLOW_STATUS_WAITING = 3;          // waiting on environment protection
  WORKFLOW_STATUS_ACTION_REQUIRED = 4;  // waiting on run approval
  WORKFLOW_STATUS_QUEUED = 5;
  WORKFLOW_STATUS_IN_PROGRESS = 6;
  WORKFLOW_STATUS_COMPLETED = 7;
}

// Outcome of a completed run, job or step.
enum WorkflowConclusion {
  WORKFLOW_CONCLUSION_UNSPECIFIED = 0; // not completed
  WORKFLOW_CONCLUSION_SUCCESS = 1;
  WORKFLOW_CONCLUSION_FAILURE = 2;
  WORKFLOW_CONCLUSION_NEUTRAL = 3;
  WORKFLOW_CONCLUSION_CANCELLED = 4;
  WORKFLOW_CONCLUSION_SKIPPED = 5;
  WORKFLOW_CONCLUSION_TIMED_OUT = 6;
  WORKFLOW_CONCLUSION_ACTION_REQUIRED = 7;
  WORKFLOW_CONCLUSION_STALE = 8;
  WORKFLOW_CONCLUSION_STARTUP_FAILURE = 9;
}

// ---------- Workflows ----------

// Whether a workflow can be triggered.
enum WorkflowState {
  WORKFLOW_STATE_UNSPECIFIED = 0;
  WORKFLOW_STATE_ACTIVE = 1;
  WORKFLOW_STATE_DISABLED_MANUALLY = 2;
  WORKFLOW_STATE_DISABLED_INACTIVITY = 3; // scheduled workflow in an inactive repo
  WORKFLOW_STATE_DISABLED_FORK = 4;
  WORKFLOW_STATE_DELETED = 5;             // file removed from the ref
}

// A declared `workflow_dispatch` input.
message WorkflowDispatchInput {
  string name = 1;
  string description = 2;
  string type = 3;            // "string", "boolean", "number", "choice" or "environment"
  bool required = 4;
  string default_value = 5;
  repeated string options = 6; // for "choice"
}

// A workflow file and what it declares.
message Workflow {
  string id = 1;
  RepoRef repo = 2;
  string name = 3;
  string path = 4;  // e.g. ".github/workflows/ci.yml"
  WorkflowState state = 5;
  string ref = 6;   // ref the definition was read from
  ObjectId blob = 7; // blob id of the YAML at that ref
  repeated string triggers = 8; // event names under `on:`
  repeated WorkflowDispatchInput dispatch_inputs = 9;
  string source = 10; // YAML text, when requested
  string badge_url = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// Request for ListWorkflows.
message ListWorkflowsRequest {
  RepoRef repo = 1;
  string ref = 2; // empty = default ref
  PageRequest page = 3;
}

// Response for ListWorkflows.
message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
  PageResponse page = 2;
}

// Request for GetWorkflow.
message GetWorkflowRequest {
  RepoRef repo = 1;
  string workflow = 2; // id, path, or file name such as "ci.yml"
  string ref = 3;
  bool include_source = 4;
}

// Severity of a workflow validation finding.
enum WorkflowDiagnosticSeverity {
  WORKFLOW_DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  WORKFLOW_DIAGNOSTIC_SEVERITY_ERROR = 1;
  WORKFLOW_DIAGNOSTIC_SEVERITY_WARNING = 2;
  WORKFLOW_DIAGNOSTIC_SEVERITY_NOTICE = 3;
}

// One problem found in workflow YAML.
message WorkflowDiagnostic {
  WorkflowDiagnosticSeverity severity = 1;
  uint32 line = 2;
  uint32 column = 3;
  string message = 4;
  string rule = 5; // e.g. "unknown_action", "bad_expression", "disallowed_action"
}

// Request for ValidateWorkflow.
message ValidateWorkflowRequest {
  RepoRef repo = 1;
  string path = 2;   // path the file would live at
  string source = 3; // YAML text
  string ref = 4;    // resolve reusable workflows and policies as of this ref
}

// Response for ValidateWorkflow.
message ValidateWorkflowResponse {
  bool valid = 1;
  repeated WorkflowDiagnostic diagnostics = 2;
  repeated string triggers = 3;
}

// Request for EnableWorkflow.
message EnableWorkflowRequest {
  RepoRef repo = 1;
  string workflow = 2;
}

// Request for DisableWorkflow.
message DisableWorkflowRequest {
  RepoRef repo = 1;
  string workflow = 2;
}

// Usage of one runner class.
message WorkflowRunnerUsage {
  string machine_class = 1; // e.g. "linux-x64-4", or "self-hosted"
  uint64 billable_ms = 2;
  uint64 job_count = 3;
}

// Request for GetWorkflowUsage.
message GetWorkflowUsageRequest {
  RepoRef repo = 1;
  string workflow = 2;
}

// Time used by a workflow's runs in the current billing period.
message WorkflowUsage {
  string workflow_id = 1;
  repeated WorkflowRunnerUsage runners = 2;
  uint64 run_duration_ms = 3;
  google.protobuf.Timestamp period_start_at = 4;
}

// ---------- Dispatch ----------

// Request for DispatchWorkflow.
message DispatchWorkflowRequest {
  RepoRef repo = 1;
  string workflow = 2;            // id, path or file name
  string ref = 3;                 // ref whose workflow definition runs
  repeated KeyValue inputs = 4;   // values are strings; booleans "true"/"false"
}

// Response for DispatchWorkflow.
message DispatchWorkflowResponse {
  string run_id = 1;
  uint64 run_number = 2;
}

// Request for CreateRepositoryDispatchEvent.
message CreateRepositoryDispatchEventRequest {
  RepoRef repo = 1;
  string event_type = 2;           // matched against `on.repository_dispatch.types`
  string client_payload_json = 3;  // JSON object, at most 10 top-level keys
}

// Response for CreateRepositoryDispatchEvent.
message CreateRepositoryDispatchEventResponse {
  repeated string run_ids = 1; // runs started, if known synchronously
}

// ---------- Runs ----------

// Concurrency group state of a run (`concurrency:` key).
message WorkflowRunConcurrency {
  string group = 1;               // evaluated group name
  bool cancel_in_progress = 2;
  uint32 queue_position = 3;      // 0 = running or not queued
  repeated string blocking_run_ids = 4; // runs holding the group
}

// A reusable workflow a run called.
message WorkflowReference {
  string path = 1; // "org/repo/.github/workflows/x.yml"
  string ref = 2;
  ObjectId changeset = 3;
}

// One attempt of a workflow run.
message WorkflowRun {
  string id = 1;
  RepoRef repo = 2;
  string workflow_id = 3;
  string workflow_path = 4;
  string name = 5;
  string display_title = 6;
  uint64 run_number = 7;  // per workflow, GitHub-compatible
  uint32 run_attempt = 8;
  string event = 9;       // triggering event, e.g. "push", "pull_request", "workflow_dispatch"
  WorkflowStatus status = 10;
  WorkflowConclusion conclusion = 11;
  string head_ref = 12;
  ObjectId head_changeset = 13;
  RepoRef head_repo = 14; // differs from repo for fork change requests
  repeated uint64 change_request_numbers = 15;
  Principal actor = 16;            // who caused the first attempt
  Principal triggering_actor = 17; // who caused this attempt
  WorkflowRunConcurrency concurrency = 18;
  repeated WorkflowReference referenced_workflows = 19;
  string check_suite_id = 20;
  bool debug_logging = 21;
  bool approval_required = 22; // held for first-time contributor, fork or agent approval
  string previous_attempt_id = 23;
  google.protobuf.Timestamp created_at = 24;
  google.protobuf.Timestamp run_started_at = 25;
  google.protobuf.Timestamp updated_at = 26;
  google.protobuf.Timestamp completed_at = 27;
  string html_url = 28;
  // Jobs of the run, set when include_jobs was requested (gap G7).
  repeated WorkflowJob jobs = 29;
  // Change requests whose revisions this run checked (gap G8).
  repeated string change_request_ids = 30;
  // The numeric run id (`github.run_id`, the REST compatibility id), unique per server.
  uint64 numeric_id = 31;
}

// Request for ListWorkflowRuns.
message ListWorkflowRunsRequest {
  RepoRef repo = 1;
  string workflow = 2;  // id, path or file name; empty = all
  string ref = 3;       // head ref
  string event = 4;
  WorkflowStatus status = 5;
  WorkflowConclusion conclusion = 6;
  string actor_id = 7;
  ObjectId head_changeset = 8;
  uint64 change_request_number = 9;
  google.protobuf.Timestamp created_after = 10;
  google.protobuf.Timestamp created_before = 11;
  bool exclude_change_requests = 12;
  PageRequest page = 13;
  // Include each run's jobs inline (gap G7).
  bool include_jobs = 14;
}

// Response for ListWorkflowRuns.
message ListWorkflowRunsResponse {
  repeated WorkflowRun runs = 1;
  PageResponse page = 2;
  uint64 total_count = 3;
}

// Request for GetWorkflowRun.
message GetWorkflowRunRequest {
  RepoRef repo = 1;
  string run_id = 2;
}

// Request for GetWorkflowRunAttempt.
message GetWorkflowRunAttemptRequest {
  RepoRef repo = 1;
  string run_id = 2;
  uint32 attempt = 3;
}

// Request for WatchWorkflowRun.
message WatchWorkflowRunRequest {
  RepoRef repo = 1;
  string run_id = 2;
}

// A change to a watched run; the first message carries the current snapshot.
message WorkflowRunUpdate {
  WorkflowRun run = 1;
  repeated WorkflowJob changed_jobs = 2;
  bool final = 3; // the run completed; the stream ends after this message
}

// Request for CancelWorkflowRun.
message CancelWorkflowRunRequest {
  RepoRef repo = 1;
  string run_id = 2;
}

// Response for CancelWorkflowRun.
message CancelWorkflowRunResponse {}

// Request for ForceCancelWorkflowRun.
message ForceCancelWorkflowRunRequest {
  RepoRef repo = 1;
  string run_id = 2;
}

// Response for ForceCancelWorkflowRun.
message ForceCancelWorkflowRunResponse {}

// Request for RerunWorkflowRun.
message RerunWorkflowRunRequest {
  RepoRef repo = 1;
  string run_id = 2;
  bool enable_debug_logging = 3;
}

// Request for RerunFailedWorkflowJobs.
message RerunFailedWorkflowJobsRequest {
  RepoRef repo = 1;
  string run_id = 2;
  bool enable_debug_logging = 3;
}

// Request for RerunWorkflowJob.
message RerunWorkflowJobRequest {
  RepoRef repo = 1;
  string job_id = 2;
  bool enable_debug_logging = 3;
}

// Request for DeleteWorkflowRun.
message DeleteWorkflowRunRequest {
