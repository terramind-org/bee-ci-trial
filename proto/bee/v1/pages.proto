// Beehive Pages for bee.v1 (PRODUCT §4.17).
// Static sites served from a ref and folder, or from a workflow artifact, with custom
// domains, automatic ACME certificates and access-controlled (private) sites.
syntax = "proto3";

package bee.v1;

import "google/protobuf/timestamp.proto";
import "bee/v1/common.proto";

// Static site hosting per repo.
service PagesService {
  // Creates a repo's site. Errors: ALREADY_EXISTS, POLICY_DENIED (org forbids public sites).
  rpc CreatePagesSite(CreatePagesSiteRequest) returns (PagesSite);
  // Returns a repo's site. Errors: NOT_FOUND.
  rpc GetPagesSite(GetPagesSiteRequest) returns (PagesSite);
  // Updates source, access or HTTPS enforcement; unset fields are unchanged.
  // Errors: INVALID_STATE (enforce_https before a certificate is issued).
  rpc UpdatePagesSite(UpdatePagesSiteRequest) returns (PagesSite);
  // Unpublishes and deletes a repo's site. Errors: NOT_FOUND.
  rpc DeletePagesSite(DeletePagesSiteRequest) returns (DeletePagesSiteResponse);
  // Lists builds and deployments of a site, newest first.
  rpc ListPagesDeployments(ListPagesDeploymentsRequest) returns (ListPagesDeploymentsResponse);
  // Returns one deployment, or the latest when no id is given. Errors: NOT_FOUND.
  rpc GetPagesDeployment(GetPagesDeploymentRequest) returns (PagesDeployment);
  // Builds and deploys the configured ref and folder now. Errors: INVALID_STATE (site uses
  // the workflow build type).
  rpc RequestPagesBuild(RequestPagesBuildRequest) returns (PagesDeployment);
  // Deploys a workflow artifact. Callable with a job token holding `pages: write`.
  // Errors: NOT_FOUND (artifact), TOO_LARGE (site over the size limit), APPROVAL_REQUIRED
  // (the `github-pages` environment is protected).
  rpc CreatePagesDeployment(CreatePagesDeploymentRequest) returns (PagesDeployment);
  // Cancels a deployment in progress. Errors: INVALID_STATE (finished).
  rpc CancelPagesDeployment(CancelPagesDeploymentRequest) returns (PagesDeployment);
  // Sets or clears the site's custom domain and starts certificate issuance.
  // Errors: ALREADY_EXISTS (domain used by another site), PERMISSION_DENIED (domain verified
  // by another org).
  rpc SetPagesCustomDomain(SetPagesCustomDomainRequest) returns (PagesSite);
  // Re-requests an ACME certificate for the custom domain. Errors: INVALID_STATE (DNS not ready).
  rpc RequestPagesCertificate(RequestPagesCertificateRequest) returns (PagesCertificate);
  // Checks DNS of the site's custom domain and its www/apex alternate.
  rpc GetPagesHealthCheck(GetPagesHealthCheckRequest) returns (PagesHealthCheck);
  // Starts verification of a domain for an org's Pages, returning the TXT record to publish.
  rpc AddPagesVerifiedDomain(AddPagesVerifiedDomainRequest) returns (PagesDomainVerification);
  // Lists an org's Pages domain verifications.
  rpc ListPagesVerifiedDomains(ListPagesVerifiedDomainsRequest) returns (ListPagesVerifiedDomainsResponse);
  // Checks the TXT record now. A failed lookup is not an error: it returns the verification
  // with state FAILED. Errors: NOT_FOUND.
  rpc VerifyPagesDomain(VerifyPagesDomainRequest) returns (PagesDomainVerification);
  // Removes an org domain verification. Errors: NOT_FOUND.
  rpc DeletePagesVerifiedDomain(DeletePagesVerifiedDomainRequest) returns (DeletePagesVerifiedDomainResponse);
  // Lists a site's live preview deployments (per change request and artifact previews),
  // newest first. Needs `read`.
  rpc ListPagesPreviews(ListPagesPreviewsRequest) returns (ListPagesPreviewsResponse);
  // An org's Pages settings. Needs org membership.
  rpc GetPagesOrgSettings(GetPagesOrgSettingsRequest) returns (PagesOrgSettings);
  // Updates an org's Pages settings. Needs org owner or admin.
  rpc UpdatePagesOrgSettings(UpdatePagesOrgSettingsRequest) returns (PagesOrgSettings);
}

// ---------- Site ----------

// How a site's content is produced.
enum PagesBuildType {
  PAGES_BUILD_TYPE_UNSPECIFIED = 0;
  PAGES_BUILD_TYPE_REF = 1;      // serve (or build) a folder of a ref on every update
  PAGES_BUILD_TYPE_WORKFLOW = 2; // a workflow uploads an artifact and deploys it
}

// Who can read a site.
enum PagesAccess {
  PAGES_ACCESS_UNSPECIFIED = 0;
  PAGES_ACCESS_PUBLIC = 1;
  PAGES_ACCESS_PRIVATE = 2; // only principals who can read the repo
}

// Publication state of a site.
enum PagesSiteStatus {
  PAGES_SITE_STATUS_UNSPECIFIED = 0;
  PAGES_SITE_STATUS_NONE = 1;     // nothing deployed yet
  PAGES_SITE_STATUS_BUILDING = 2;
  PAGES_SITE_STATUS_BUILT = 3;
  PAGES_SITE_STATUS_ERRORED = 4;
}

// The ref and folder a REF-type site serves.
message PagesSource {
  string ref = 1;  // e.g. "main" or "gh-pages"
  string path = 2; // "/" or "/docs"
}

// ACME certificate state for a custom domain.
enum PagesCertificateState {
  PAGES_CERTIFICATE_STATE_UNSPECIFIED = 0;
  PAGES_CERTIFICATE_STATE_NONE = 1;      // no custom domain
  PAGES_CERTIFICATE_STATE_REQUESTED = 2; // waiting on DNS or the ACME challenge
  PAGES_CERTIFICATE_STATE_ISSUED = 3;
  PAGES_CERTIFICATE_STATE_EXPIRED = 4;
  PAGES_CERTIFICATE_STATE_ERRORED = 5;
}

// The HTTPS certificate of a site's custom domain.
message PagesCertificate {
  PagesCertificateState state = 1;
  repeated string domains = 2;
  string error_message = 3; // with ERRORED
  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp expires_at = 5;
}

// A repo's static site.
message PagesSite {
  RepoRef repo = 1;
  string url = 2;
  PagesSiteStatus status = 3;
  PagesBuildType build_type = 4;
  PagesSource source = 5;        // build type REF
  string custom_domain = 6;
  bool enforce_https = 7;
  PagesCertificate certificate = 8;
  PagesAccess access = 9;
  string current_deployment_id = 10;
  ObjectId served_tree = 11;     // tree id currently served, for REF sites without a build step
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  bool previews_enabled = 14;    // per change request previews (REF sites)
  uint32 preview_ttl_days = 15;  // days a preview lives
}

// Request for CreatePagesSite.
message CreatePagesSiteRequest {
  RepoRef repo = 1;
  PagesBuildType build_type = 2;
  PagesSource source = 3;
  PagesAccess access = 4;
}

// Request for GetPagesSite.
message GetPagesSiteRequest {
  RepoRef repo = 1;
}

// Request for UpdatePagesSite.
message UpdatePagesSiteRequest {
  RepoRef repo = 1;
  optional PagesBuildType build_type = 2;
  PagesSource source = 3; // unset = unchanged
  optional PagesAccess access = 4;
  optional bool enforce_https = 5;
  optional bool previews_enabled = 6;
  optional uint32 preview_ttl_days = 7; // 0 keeps the current value
}

// Request for DeletePagesSite.
message DeletePagesSiteRequest {
  RepoRef repo = 1;
}

// Response for DeletePagesSite.
message DeletePagesSiteResponse {}

// ---------- Deployments ----------

// Progress of a site build or deployment.
enum PagesDeploymentState {
  PAGES_DEPLOYMENT_STATE_UNSPECIFIED = 0;
  PAGES_DEPLOYMENT_STATE_QUEUED = 1;
  PAGES_DEPLOYMENT_STATE_BUILDING = 2;
  PAGES_DEPLOYMENT_STATE_DEPLOYING = 3;
  PAGES_DEPLOYMENT_STATE_SUCCEEDED = 4;
  PAGES_DEPLOYMENT_STATE_FAILED = 5;
  PAGES_DEPLOYMENT_STATE_CANCELLED = 6;
}

// One build or deployment of a site.
message PagesDeployment {
  string id = 1;
  RepoRef repo = 2;
  PagesDeploymentState state = 3;
  PagesBuildType build_type = 4;
  string ref = 5;
  ObjectId changeset = 6;
  string artifact_id = 7;     // build type WORKFLOW
  string workflow_run_id = 8;
  string deployment_id = 9;   // DeploymentService deployment to the Pages environment
  string page_url = 10;
  string preview_url = 11;
  string error_message = 12;
  uint64 duration_ms = 13;
  Principal creator = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  bool preview = 17;                      // a preview (does not replace the live site)
  uint64 change_request_number = 18;      // per change request previews
  google.protobuf.Timestamp expires_at = 19; // previews only
}

// Request for ListPagesDeployments.
message ListPagesDeploymentsRequest {
  RepoRef repo = 1;
  PageRequest page = 2;
}

// Response for ListPagesDeployments.
message ListPagesDeploymentsResponse {
  repeated PagesDeployment deployments = 1;
  PageResponse page = 2;
}

// Request for GetPagesDeployment.
message GetPagesDeploymentRequest {
  RepoRef repo = 1;
  string pages_deployment_id = 2; // empty = latest
}

// Request for RequestPagesBuild.
message RequestPagesBuildRequest {
  RepoRef repo = 1;
}

// Request for CreatePagesDeployment.
message CreatePagesDeploymentRequest {
  RepoRef repo = 1;
  string artifact_id = 2;
  ObjectId changeset = 3;  // changeset the artifact was built from
  string environment = 4;  // default "github-pages"
  bool preview = 5;        // deploy to a preview URL without replacing the live site
}

// Request for CancelPagesDeployment.
message CancelPagesDeploymentRequest {
  RepoRef repo = 1;
  string pages_deployment_id = 2;
}

// ---------- Domains and certificates ----------

// Request for SetPagesCustomDomain.
message SetPagesCustomDomainRequest {
  RepoRef repo = 1;
  string domain = 2; // empty clears the custom domain
}

// Request for RequestPagesCertificate.
message RequestPagesCertificateRequest {
  RepoRef repo = 1;
}

// Request for GetPagesHealthCheck.
message GetPagesHealthCheckRequest {
  RepoRef repo = 1;
}

// DNS findings for one host name.
message PagesDomainHealth {
  string host = 1;
  bool dns_resolves = 2;
  bool is_apex = 3;
  bool points_to_pages = 4;
  bool has_cname_record = 5;
  string cname_target = 6;
  repeated string a_records = 7;
  repeated string aaaa_records = 8;
  bool is_proxied = 9;           // behind a third-party proxy or CDN
  bool has_caa_conflict = 10;    // a CAA record forbids the ACME issuer
  bool https_eligible = 11;
  repeated string problems = 12; // human-readable fixes
}

// DNS health of a site's custom domain.
message PagesHealthCheck {
  PagesDomainHealth domain = 1;
  PagesDomainHealth alt_domain = 2; // www or apex counterpart
  google.protobuf.Timestamp checked_at = 3;
}

// Progress of an org domain verification.
enum PagesDomainVerificationState {
  PAGES_DOMAIN_VERIFICATION_STATE_UNSPECIFIED = 0;
  PAGES_DOMAIN_VERIFICATION_STATE_PENDING = 1;
  PAGES_DOMAIN_VERIFICATION_STATE_VERIFIED = 2;
  PAGES_DOMAIN_VERIFICATION_STATE_FAILED = 3;
}

// An org's claim on a domain, proven by a DNS TXT record, so no other account can serve it.
message PagesDomainVerification {
  string id = 1;
  string org = 2;
  string domain = 3;
  PagesDomainVerificationState state = 4;
  string txt_record_name = 5;  // e.g. "_beehive-pages-challenge-org.example.com"
  string txt_record_value = 6;
  google.protobuf.Timestamp verified_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

// Request for AddPagesVerifiedDomain.
message AddPagesVerifiedDomainRequest {
  string org = 1;
  string domain = 2;
}

// Request for ListPagesVerifiedDomains.
message ListPagesVerifiedDomainsRequest {
  string org = 1;
  PageRequest page = 2;
}

// Response for ListPagesVerifiedDomains.
message ListPagesVerifiedDomainsResponse {
  repeated PagesDomainVerification domains = 1;
  PageResponse page = 2;
}

// Request for VerifyPagesDomain.
message VerifyPagesDomainRequest {
  string org = 1;
  string verification_id = 2;
}

// Request for DeletePagesVerifiedDomain.
message DeletePagesVerifiedDomainRequest {
  string org = 1;
  string verification_id = 2;
}

// Response for DeletePagesVerifiedDomain.
message DeletePagesVerifiedDomainResponse {}

// Request for ListPagesPreviews.
message ListPagesPreviewsRequest {
  RepoRef repo = 1;
}

// Response for ListPagesPreviews.
message ListPagesPreviewsResponse {
  repeated PagesDeployment previews = 1;
}

// An org's Pages settings.
message PagesOrgSettings {
  string org = 1;
  bool forbid_public = 2;     // sites must be private (POLICY_DENIED otherwise)
}

// Request for GetPagesOrgSettings.
message GetPagesOrgSettingsRequest {
  string org = 1;
}

// Request for UpdatePagesOrgSettings.
message UpdatePagesOrgSettingsRequest {
  string org = 1;
  optional bool forbid_public = 2;
}
