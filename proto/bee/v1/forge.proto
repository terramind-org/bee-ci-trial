// Everything an agent should know before editing paths (SPEC §11, "repo context API").
message GetContextRequest {
  RepoRef repo = 1;
  Revision at = 2;
  repeated bytes paths = 3;
}

message RepoContext {
  repeated PathOwners owners = 1;
  repeated Lease active_leases = 2;
  repeated ChangeRequest open_changes_touching = 3;
  repeated CheckRun failing_checks = 4;
  repeated string land_rules = 5; // human-readable summary of rules that apply
  // Agent instructions that apply to the paths (AGENTS.md, CLAUDE.md, .github/agents/*.md).
  repeated ContextInstruction instructions = 6;
  string policy_epoch = 7;
  repeated string sensitive_paths = 8; // paths policy marks sensitive among those asked about
}

// One agent instruction file found in the repo for the requested paths.
message ContextInstruction {
  bytes path = 1;
  ObjectId blob = 2;
  string content = 3; // included up to a size limit
  bool truncated = 4;
}

message PathOwners {
  bytes path = 1;
  repeated string owners = 2;
}

// ---------- Change requests and reviews ----------

enum ChangeState {
  CHANGE_STATE_UNSPECIFIED = 0;
  CHANGE_STATE_OPEN = 1;
  CHANGE_STATE_LANDED = 2;
  CHANGE_STATE_CLOSED = 3;
}

message ChangeRevision {
  uint32 n = 1;
  ObjectId head = 2;
  ObjectId base = 3;
  string diff_class = 4; // highest-risk class in this revision
  google.protobuf.Timestamp created_at = 5;
  Principal pusher = 6;  // who pushed this revision
}

message ChangeRequest {
  string id = 1;
  string repo_id = 2;
  string target_ref = 3;
  repeated ChangeId change_ids = 4;
  ChangeState state = 5;
  Principal author = 6;
  string title = 7;
  string body = 8;
  repeated ChangeRevision revisions = 9;
  string depends_on = 10; // parent CR id for stacked CRs
  google.protobuf.Timestamp created_at = 11;
  uint64 number = 12;     // per-repo number shared with issues
  bool draft = 13;
  repeated Label labels = 14;
  repeated Principal assignees = 15;
  Milestone milestone = 16;
  repeated ReviewRequest review_requests = 17;
  bool locked = 18;
  AutoMerge auto_merge = 19;            // set while auto-merge is enabled
  MergeQueueEntry merge_queue_entry = 20; // set while queued
  google.protobuf.Timestamp updated_at = 21;
  google.protobuf.Timestamp closed_at = 22;
  google.protobuf.Timestamp landed_at = 23;
  string close_reason = 24;
  uint64 version = 25;
  string summary = 26;                  // agent- or human-authored summary
  Principal summary_author = 27;
  repeated uint64 linked_issues = 28;   // issue numbers this CR implements
  Ref landed_ref = 29;                  // ref and version the CR landed at
  uint32 comment_count = 30;
  repeated ReactionGroup reactions = 31;
  string revert_of = 32;                // CR id this CR reverts
  string head_repo_id = 33;             // fork the head comes from; empty = this repo
  string head_ref = 34;                 // ref (in head_repo_id, else this repo) the CR was opened from
  bool allow_maintainer_edits = 35;     // fork CRs: target-repo writers may push to head_ref
  // The linked issues that close when the CR lands (closing keywords, plus manual links
  // made with close_on_land), sorted; a subset of linked_issues.
  repeated uint64 closing_issues = 36;
  Post post = 37;                       // the CR's post, read-only summary; unset when it has none
  PostRef inspired_by = 38;             // the post that inspired it; empty when its repo is unreadable
  ChangeBrief brief = 39;               // what it does, in words (SPEC §11.9); unset until written
}

// A change request's brief (SPEC §11.9): what a busy person reads first. Set through
// BriefService.SetChangeBrief or OpenChangeRequest.brief; fields 7-9 are set by the server.
message ChangeBrief {
  string outcome = 1;                     // one line: what is different for users, at most 280 characters
  repeated BriefHighlight highlights = 2; // at most 20
  repeated BriefAsk asks = 3;             // decisions the author wants from a person, at most 20
  repeated BriefRisk risks = 4;           // at most 20
  string rollback = 5;                    // how to undo it, in words
  string try_it_url = 6;                  // https URL where the change can be tried
  uint32 written_for_revision = 7;        // the current revision when the brief was set
  Principal author = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// One thing the change does, with the paths that do it.
message BriefHighlight {
  string text = 1;                        // at most 280 characters
  repeated string paths = 2;              // repo paths (UTF-8), at most 20
}

// A decision the author asks a person to make. Answering posts a comment
// `Decision on "<question>": <option>` that agents read.
message BriefAsk {
  string question = 1;                    // at most 280 characters
  repeated string options = 2;            // 2-6 options, each at most 80 characters
}

// A risk the author sees, and what mitigates it.
message BriefRisk {
  string text = 1;                        // at most 280 characters
  string mitigation = 2;                  // at most 280 characters
}

// A pending review request for a principal or a team.
message ReviewRequest {
  Principal reviewer = 1; // set for principals
  string team_id = 2;     // set for teams
  Principal requested_by = 3;
  google.protobuf.Timestamp requested_at = 4;
  bool auto_assigned = 5;
}

// Auto-merge settings on a CR.
message AutoMerge {
  Principal enabled_by = 1;
  LandMethod method = 2;
  string commit_message = 3;
  google.protobuf.Timestamp enabled_at = 4;
  // Delegation chain the land is evaluated for (enabled_by first, the root last).
  repeated string on_behalf_of = 5;
}

// State of a CR in a merge queue.
enum MergeQueueState {
  MERGE_QUEUE_STATE_UNSPECIFIED = 0;
  MERGE_QUEUE_STATE_QUEUED = 1;
  MERGE_QUEUE_STATE_CHECKING = 2;  // pre-land checks running on the queued result
  MERGE_QUEUE_STATE_LANDING = 3;
  MERGE_QUEUE_STATE_LANDED = 4;
  MERGE_QUEUE_STATE_EJECTED = 5;   // removed after a conflict or failing check
}

// One CR's place in a ref's merge queue.
message MergeQueueEntry {
  string change_request_id = 1;
  uint64 change_number = 2;
  string ref = 3;
  uint32 position = 4;          // 1 = next
  MergeQueueState state = 5;
  Principal enqueued_by = 6;
  google.protobuf.Timestamp enqueued_at = 7;
  google.protobuf.Timestamp estimated_land_at = 8;
  uint32 priority = 9;          // higher jumps ahead within policy limits
  string eject_reason = 10;     // ErrorReason name when EJECTED
  ObjectId speculative_head = 11; // the queued result being checked
  // Title of the change request in the queue (gap G9).
  string title = 12;
  LandMethod land_method = 13;  // how the entry lands (UNSPECIFIED = the repo default)
  // Delegation chain the land is evaluated for (enqueued_by first, the root last).
  repeated string on_behalf_of = 14;
}

message OpenChangeRequest {
  RepoRef repo = 1;
  string target_ref = 2;
  ObjectId head = 3;
  string title = 4;
  string body = 5;
  string depends_on = 6;
  bool draft = 7;
  repeated string reviewer_ids = 8;      // principals to request reviews from
  repeated string reviewer_team_ids = 9;
  repeated string labels = 10;           // label names
  repeated string assignee_ids = 11;
  string milestone_id = 12;
  repeated uint64 linked_issues = 13;
  string template = 14;                  // template name; its body is used when body is empty
  RepoRef head_repo = 15;                // fork holding head (same fork network); empty = repo
  string head_ref = 16;                  // ref the CR comes from (recorded, followed by maintainers' edits)
  bool allow_maintainer_edits = 17;      // fork CRs: let target-repo writers update head_ref
  string post_text = 18;                 // draft post text for the CR (PostService rules apply)
  // A published post the caller can read that inspired this CR; else INVALID_ARGUMENT
  // (subcode `post_not_readable`).
  string inspired_by_post_id = 19;
  // The brief to set with the change (BriefService.SetChangeBrief rules apply; fields 7-9 are
  // set by the server).
  ChangeBrief brief = 20;
}

message GetChangeRequest {
  RepoRef repo = 1;
  string id = 2;
}

message ListChangesRequest {
  RepoRef repo = 1;
  ChangeState state = 2;
  string author_id = 3;
  PageRequest page = 4;
  string target_ref = 5;
  repeated string labels = 6;
  string review_requested_id = 7; // principal or team id with a pending review request
  string assignee_id = 8;
  optional bool draft = 9;
  bytes path_prefix = 10;         // CRs touching paths under this prefix
  string query = 11;              // GitHub-compatible qualifiers, e.g. "is:open review:required"
}

message ListChangesResponse {
  repeated ChangeRequest changes = 1;
  PageResponse page = 2;
}

message ReviseChangeRequest {
  RepoRef repo = 1;
  string id = 2;
  ObjectId head = 3;
}

message CloseChangeRequest {
  RepoRef repo = 1;
  string id = 2;
  string reason = 3;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_APPROVE = 1;
  VERDICT_REQUEST_CHANGES = 2;
  VERDICT_COMMENT = 3;
}

message ReviewComment {
  string id = 1;
  bytes path = 2;
  string side = 3; // "old" | "new"
  uint32 start_line = 4;
  uint32 end_line = 5;
  string body = 6;
  uint32 revision = 7; // revision the anchor was last valid on
  string thread_id = 8;
  string in_reply_to = 9;      // comment id this replies to
  Suggestion suggestion = 10;  // a suggested replacement for the anchored lines
  bool file_level = 11;        // anchored to the file, not to lines
  bool outdated = 12;          // the anchored lines changed in a later revision
  Principal author = 13;
  google.protobuf.Timestamp created_at = 14;
  repeated ReactionGroup reactions = 15;
  MinimizedReason minimized_reason = 16;
}

// Replacement text for the lines a review comment anchors to.
message Suggestion {
  string replacement = 1; // new content for start_line..end_line, without trailing newline
  bool applied = 2;
  ObjectId applied_in = 3; // changeset that applied it
}

// A review thread: a line or file comment and its replies.
message ReviewThread {
  string id = 1;
  string change_request_id = 2;
  bytes path = 3;
  string side = 4;
  uint32 start_line = 5;
  uint32 end_line = 6;
  uint32 revision = 7;
  bool resolved = 8;
  Principal resolved_by = 9;
  bool outdated = 10;
  repeated ReviewComment comments = 11;
}

message Review {
  string id = 1;
  string change_id = 2; // change request id
  uint32 revision = 3;
  Principal reviewer = 4;
  Verdict verdict = 5;
  string body = 6;
  repeated ReviewComment comments = 7;
  google.protobuf.Timestamp created_at = 8;
  bool dismissed = 9;
  string dismiss_reason = 10;
  Principal dismissed_by = 11;
  bool stale = 12;              // made on an older revision and policy marks it stale
  bool counts_toward_policy = 13; // e.g. false for agent approvals where policy says so
}

message SubmitReviewRequest {
  RepoRef repo = 1;
  string change_request_id = 2;
  uint32 revision = 3;
  Verdict verdict = 4;
  string body = 5;
  repeated ReviewComment comments = 6;
}

message ListReviewsRequest {
  RepoRef repo = 1;
  string change_request_id = 2;
}

message ListReviewsResponse {
  repeated Review reviews = 1;
}

message EvaluateLandingRequest {
