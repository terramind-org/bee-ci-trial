  string change_request_id = 2;
}

// What policy says about landing the current revision right now.
message LandingEvaluation {
  bool allowed = 1;
  repeated string satisfied = 2;
  repeated string missing = 3;
  string diff_class = 4;
  uint32 revision = 5;
  repeated string unresolved_thread_ids = 6; // when policy requires resolved threads
  bool mergeable = 7;                        // no conflict with the target tip
  string rule = 8;    // the policy rule that decided (e.g. a [[land]] rule's id), when any
  // When not allowed: the ErrorReason name LandChange would fail with now ("POLICY_DENIED",
  // "LEASED", "DRAFT", "INVALID_STATE").
  string reason = 9;
}

