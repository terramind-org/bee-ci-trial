// Beehive forge services for bee.v1. See SPEC.md §11.
syntax = "proto3";

package bee.v1;

import "google/protobuf/timestamp.proto";
import "bee/v1/common.proto";
import "bee/v1/content.proto";
import "bee/v1/posts.proto";
import "bee/v1/vcs.proto";

service OrgService {
  rpc CreateOrg(CreateOrgRequest) returns (Org);
  rpc GetOrg(GetOrgRequest) returns (Org);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc SetMember(SetMemberRequest) returns (Member);
  // Lists orgs the caller (or a given principal) belongs to.
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse);
  // Updates display name, description, profile fields.
  rpc UpdateOrg(UpdateOrgRequest) returns (Org);
  // Renames an org. Ids and keys are untouched; the old name redirects for 90 days.
  rpc RenameOrg(RenameOrgRequest) returns (Org);
  // Soft-deletes an org and all its repos; restorable for 90 days.
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse);
  // Restores a soft-deleted org within the restore window.
  rpc RestoreOrg(RestoreOrgRequest) returns (Org);
  // Reads org settings: base permissions, member privileges, profile.
  rpc GetOrgSettings(GetOrgSettingsRequest) returns (OrgSettings);
  rpc UpdateOrgSettings(UpdateOrgSettingsRequest) returns (OrgSettings);
  // Invites a person by login, email or principal id with a role and optional teams.
  rpc CreateOrgInvitation(CreateOrgInvitationRequest) returns (OrgInvitation);
  rpc ListOrgInvitations(ListOrgInvitationsRequest) returns (ListOrgInvitationsResponse);
  rpc CancelOrgInvitation(CancelOrgInvitationRequest) returns (CancelOrgInvitationResponse);
  // Accepts an invitation addressed to the caller.
  rpc AcceptOrgInvitation(AcceptOrgInvitationRequest) returns (Member);
  rpc DeclineOrgInvitation(DeclineOrgInvitationRequest) returns (DeclineOrgInvitationResponse);
  // Assigns a built-in or custom org role (custom roles are defined in PolicyService).
  rpc AssignOrgRole(AssignOrgRoleRequest) returns (Member);
  rpc RevokeOrgRole(RevokeOrgRoleRequest) returns (Member);
  // Lists outside collaborators: people with repo access who are not members.
  rpc ListOutsideCollaborators(ListOutsideCollaboratorsRequest) returns (ListOutsideCollaboratorsResponse);
  // Turns a member into an outside collaborator, keeping their repo grants.
  rpc ConvertToOutsideCollaborator(ConvertToOutsideCollaboratorRequest) returns (ConvertToOutsideCollaboratorResponse);
}

service RepoService {
  rpc CreateRepo(CreateRepoRequest) returns (Repo);
  rpc GetRepo(GetRepoRequest) returns (Repo);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc UpdateRepo(UpdateRepoRequest) returns (Repo);
  rpc GetContext(GetContextRequest) returns (RepoContext);
  // Soft-deletes a repo; restorable for 90 days.
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);
  rpc RestoreRepo(RestoreRepoRequest) returns (Repo);
  // Lists soft-deleted repos of an org that can still be restored.
  rpc ListDeletedRepos(ListDeletedReposRequest) returns (ListDeletedReposResponse);
  // Archives a repo: every write, land and lease then fails with ARCHIVED.
  rpc ArchiveRepo(ArchiveRepoRequest) returns (Repo);
  rpc UnarchiveRepo(UnarchiveRepoRequest) returns (Repo);
  // Transfers a repo to another org. The repo id stays; objects are copied into the target
  // org's store (deduplicated) before the old name starts redirecting.
  rpc TransferRepo(TransferRepoRequest) returns (Repo);
  // Creates a repo from a template repo's tip with a fresh root changeset.
  rpc CreateRepoFromTemplate(CreateRepoFromTemplateRequest) returns (Repo);
  // Forks a repo. Content that exists only in the fork is never readable through the parent.
  rpc ForkRepo(ForkRepoRequest) returns (Repo);
  rpc ListForks(ListForksRequest) returns (ListForksResponse);
  // Brings a fork's ref up to date with its upstream ref (rebase or merge under policy).
  rpc SyncFork(SyncForkRequest) returns (SyncForkResponse);
  // Replaces the repo's topics.
  rpc SetRepoTopics(SetRepoTopicsRequest) returns (SetRepoTopicsResponse);
  rpc GetRepoSettings(GetRepoSettingsRequest) returns (RepoSettings);
  rpc UpdateRepoSettings(UpdateRepoSettingsRequest) returns (RepoSettings);
  // Autolinks turn references like `JIRA-123` into URLs when rendering.
  rpc CreateAutolink(CreateAutolinkRequest) returns (Autolink);
  rpc ListAutolinks(ListAutolinksRequest) returns (ListAutolinksResponse);
  rpc DeleteAutolink(DeleteAutolinkRequest) returns (DeleteAutolinkResponse);
  // Org-defined repo metadata schema that policy can match on.
  rpc ListCustomPropertyDefinitions(ListCustomPropertyDefinitionsRequest) returns (ListCustomPropertyDefinitionsResponse);
  rpc SetCustomPropertyDefinition(SetCustomPropertyDefinitionRequest) returns (CustomPropertyDefinition);
  rpc DeleteCustomPropertyDefinition(DeleteCustomPropertyDefinitionRequest) returns (DeleteCustomPropertyDefinitionResponse);
  rpc GetRepoCustomProperties(GetRepoCustomPropertiesRequest) returns (GetRepoCustomPropertiesResponse);
  rpc SetRepoCustomProperties(SetRepoCustomPropertiesRequest) returns (SetRepoCustomPropertiesResponse);
  // Collaborators: direct repo grants to principals (members or outside collaborators).
  rpc AddCollaborator(AddCollaboratorRequest) returns (AddCollaboratorResponse);
  rpc RemoveCollaborator(RemoveCollaboratorRequest) returns (RemoveCollaboratorResponse);
  rpc ListCollaborators(ListCollaboratorsRequest) returns (ListCollaboratorsResponse);
  // The effective repo role of one principal, with where it comes from.
  rpc GetCollaboratorPermission(GetCollaboratorPermissionRequest) returns (CollaboratorPermission);
  rpc ListRepoInvitations(ListRepoInvitationsRequest) returns (ListRepoInvitationsResponse);
  rpc AcceptRepoInvitation(AcceptRepoInvitationRequest) returns (AcceptRepoInvitationResponse);
  rpc DeclineRepoInvitation(DeclineRepoInvitationRequest) returns (DeclineRepoInvitationResponse);
  // Registers the repo's resolver endpoint (SPEC §11.6); empty url removes it.
  rpc SetResolverHook(SetResolverHookRequest) returns (ResolverHook);
  rpc GetResolverHook(GetResolverHookRequest) returns (ResolverHook);
  // Push mirrors to any git remote, in either direction.
  rpc CreateRepoMirror(CreateRepoMirrorRequest) returns (RepoMirror);
  rpc ListRepoMirrors(ListRepoMirrorsRequest) returns (ListRepoMirrorsResponse);
  rpc DeleteRepoMirror(DeleteRepoMirrorRequest) returns (DeleteRepoMirrorResponse);
  rpc SyncRepoMirror(SyncRepoMirrorRequest) returns (RepoMirror);
  // SSH deploy keys, kept for git compatibility; they map to service principals.
  rpc AddDeployKey(AddDeployKeyRequest) returns (DeployKey);
  rpc ListDeployKeys(ListDeployKeysRequest) returns (ListDeployKeysResponse);
  rpc DeleteDeployKey(DeleteDeployKeyRequest) returns (DeleteDeployKeyResponse);
  // Signed upload URL for the repo's social preview image.
  rpc CreateSocialPreviewUpload(CreateSocialPreviewUploadRequest) returns (CreateSocialPreviewUploadResponse);
}

service ChangeService {
  rpc OpenChange(OpenChangeRequest) returns (ChangeRequest);
  rpc GetChange(GetChangeRequest) returns (ChangeRequest);
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
  rpc ReviseChange(ReviseChangeRequest) returns (ChangeRequest);
  rpc CloseChange(CloseChangeRequest) returns (ChangeRequest);
  rpc SubmitReview(SubmitReviewRequest) returns (Review);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  rpc EvaluateLanding(EvaluateLandingRequest) returns (LandingEvaluation);
  // Fetches a CR by its per-repo number (shared with issues, GitHub-compatible).
  rpc GetChangeByNumber(GetChangeByNumberRequest) returns (ChangeRequest);
  // Reopens a closed CR. Fails with INVALID_STATE for landed CRs.
  rpc ReopenChange(ReopenChangeRequest) returns (ChangeRequest);
  // Edits title, body, target ref or parent CR.
  rpc EditChange(EditChangeRequest) returns (ChangeRequest);
  // Marks a draft CR ready for review.
  rpc MarkChangeReady(MarkChangeReadyRequest) returns (ChangeRequest);
  // Turns a CR back into a draft; drafts cannot land (DRAFT).
  rpc ConvertChangeToDraft(ConvertChangeToDraftRequest) returns (ChangeRequest);
  // Requests reviews from principals or teams; auto-assignment may expand teams.
  rpc RequestReviewers(RequestReviewersRequest) returns (ChangeRequest);
  rpc RemoveReviewRequests(RemoveReviewRequestsRequest) returns (ChangeRequest);
  // Dismisses a review so it no longer counts toward policy.
  rpc DismissReview(DismissReviewRequest) returns (Review);
  // Diff between two revisions of one CR ("changes since my review").
  rpc DiffChangeRevisions(DiffChangeRevisionsRequest) returns (stream DiffItem);
  // Adds a conversation, file-level or line comment. Line comments start a review thread.
  rpc CreateChangeComment(CreateChangeCommentRequest) returns (Comment);
  rpc ListChangeComments(ListChangeCommentsRequest) returns (ListChangeCommentsResponse);
  // Lists review threads with their comments, resolution and outdated state.
  rpc ListReviewThreads(ListReviewThreadsRequest) returns (ListReviewThreadsResponse);
  rpc ReplyToReviewThread(ReplyToReviewThreadRequest) returns (ReviewComment);
  rpc ResolveReviewThread(ResolveReviewThreadRequest) returns (ReviewThread);
  rpc UnresolveReviewThread(UnresolveReviewThreadRequest) returns (ReviewThread);
  // Applies one or more suggestions as a new revision of the CR (batch apply).
  rpc ApplySuggestions(ApplySuggestionsRequest) returns (ChangeRequest);
  // Marks a file viewed or not viewed for the caller on the current revision.
  rpc SetFileViewed(SetFileViewedRequest) returns (SetFileViewedResponse);
  rpc ListViewedFiles(ListViewedFilesRequest) returns (ListViewedFilesResponse);
  rpc SetChangeLabels(SetChangeLabelsRequest) returns (ChangeRequest);
  rpc SetChangeAssignees(SetChangeAssigneesRequest) returns (ChangeRequest);
  rpc SetChangeMilestone(SetChangeMilestoneRequest) returns (ChangeRequest);
  // Links issues the CR implements; closing keywords in the body link them automatically.
  rpc LinkChangeIssues(LinkChangeIssuesRequest) returns (ChangeRequest);
  // CR templates read from the target ref (`.github/pull_request_template.md` and friends).
  rpc ListChangeTemplates(ListChangeTemplatesRequest) returns (ListChangeTemplatesResponse);
  // Lands the CR's current revision now through Land under policy.
  rpc LandChange(LandChangeRequest) returns (LandChangeResponse);
  // Lands automatically once policy is satisfied (fires on check and review events).
  rpc EnableAutoMerge(EnableAutoMergeRequest) returns (ChangeRequest);
  rpc DisableAutoMerge(DisableAutoMergeRequest) returns (ChangeRequest);
  // Adds the CR to the target ref's merge queue (served by the land coalescer, SPEC §7.4).
  rpc EnqueueChange(EnqueueChangeRequest) returns (MergeQueueEntry);
  rpc DequeueChange(DequeueChangeRequest) returns (DequeueChangeResponse);
  // Merge queue for a ref: entries in order, their state and estimated time to land.
  rpc GetMergeQueue(GetMergeQueueRequest) returns (GetMergeQueueResponse);
  // Opens a CR that reverts a landed CR.
  rpc RevertChange(RevertChangeRequest) returns (ChangeRequest);
  // Rebases the CR onto the current tip of its target ("update branch").
  rpc UpdateChangeBase(UpdateChangeBaseRequest) returns (ChangeRequest);
  // The CRs of a stack, bottom first.
  rpc ListChangeStack(ListChangeStackRequest) returns (ListChangeStackResponse);
  // Sets the agent- or human-authored summary of a CR.
  rpc SetChangeSummary(SetChangeSummaryRequest) returns (ChangeRequest);
  // Comments anchored to a changeset outside any CR (commit comments).
  rpc CreateChangesetComment(CreateChangesetCommentRequest) returns (Comment);
  rpc ListChangesetComments(ListChangesetCommentsRequest) returns (ListChangesetCommentsResponse);
  // A conflict a land or rebase hit, as structured data (SPEC §7.3.2), for resolvers.
  rpc GetLandConflict(GetLandConflictRequest) returns (LandConflict);
  rpc ListLandConflicts(ListLandConflictsRequest) returns (ListLandConflictsResponse);
  // Submits a resolution changeset; it goes through the same checks and policy as any change.
  rpc SubmitConflictResolution(SubmitConflictResolutionRequest) returns (LandConflict);

  // Adds the caller's reaction to a change request, or to one of its comments when
  // comment_id is set. Needs `read`; moderation applies.
  rpc AddChangeReaction(AddChangeReactionRequest) returns (ChangeReactionResponse);
  // Removes the caller's reaction from a change request or one of its comments.
  rpc RemoveChangeReaction(RemoveChangeReactionRequest) returns (ChangeReactionResponse);
  // Locks or unlocks a change request's conversation: while locked only people with
  // `triage` comment. Needs `triage`.
  rpc SetChangeLocked(SetChangeLockedRequest) returns (ChangeRequest);
}

service CheckService {
  rpc ReportCheck(ReportCheckRequest) returns (CheckRun);
  rpc ListChecks(ListChecksRequest) returns (ListChecksResponse);
  rpc GetCheckRun(GetCheckRunRequest) returns (CheckRun);
  // Updates status, output and annotations of an existing run.
  rpc UpdateCheckRun(UpdateCheckRunRequest) returns (CheckRun);
  rpc ListCheckAnnotations(ListCheckAnnotationsRequest) returns (ListCheckAnnotationsResponse);
  // Asks the reporter (app or workflow) to run one check again.
  rpc RerequestCheckRun(RerequestCheckRunRequest) returns (CheckRun);
  rpc CreateCheckSuite(CreateCheckSuiteRequest) returns (CheckSuite);
  rpc ListCheckSuites(ListCheckSuitesRequest) returns (ListCheckSuitesResponse);
  rpc RerequestCheckSuite(RerequestCheckSuiteRequest) returns (CheckSuite);
  // Legacy commit statuses (`state` + `context`), stored as check runs.
  rpc CreateCommitStatus(CreateCommitStatusRequest) returns (CommitStatus);
  rpc ListCommitStatuses(ListCommitStatusesRequest) returns (ListCommitStatusesResponse);
  rpc GetCombinedStatus(GetCombinedStatusRequest) returns (CombinedStatus);
  // Starts a bisect of a landed range for a failing post-land check (SPEC §11.6).
  rpc StartBisect(StartBisectRequest) returns (Bisect);
  rpc GetBisect(GetBisectRequest) returns (Bisect);
  rpc ListBisects(ListBisectsRequest) returns (ListBisectsResponse);
  // A bisect session in full: candidates, probes and marks, rounds and notes. Needs `read`.
  rpc GetBisectSession(GetBisectSessionRequest) returns (BisectSession);
  // The changeset a manual session should test next; empty once decided. Needs `read`.
  rpc GetBisectNextCandidate(GetBisectNextCandidateRequest) returns (GetBisectNextCandidateResponse);
  // Marks a candidate of a manual session good, bad or untestable and advances it. Needs
  // `commit`. Errors: INVALID_STATE (finished, or driven by CI probes), INVALID_ARGUMENT
  // (`not_a_candidate`).
  rpc MarkBisect(MarkBisectRequest) returns (Bisect);
  // Cancels a running session and its probes. Needs `commit`. Errors: INVALID_STATE.
  rpc CancelBisect(CancelBisectRequest) returns (Bisect);
}

service LeaseService {
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
  rpc RenewLease(RenewLeaseRequest) returns (Lease);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse);
  rpc GetLease(GetLeaseRequest) returns (Lease);
}

service EventService {
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  rpc CreateWebhook(CreateWebhookRequest) returns (Webhook);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc GetWebhook(GetWebhookRequest) returns (Webhook);
  rpc UpdateWebhook(UpdateWebhookRequest) returns (Webhook);
  // Sends a `ping` event to the webhook now.
  rpc PingWebhook(PingWebhookRequest) returns (WebhookDelivery);
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse);
  // One delivery with its request and response.
  rpc GetWebhookDelivery(GetWebhookDeliveryRequest) returns (WebhookDelivery);
  rpc RedeliverWebhook(RedeliverWebhookRequest) returns (WebhookDelivery);
  // Pages through the retained event log without streaming.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // Oldest retained and latest sequence numbers of a repo or org log.
  rpc GetEventLogInfo(GetEventLogInfoRequest) returns (EventLogInfo);
}

// ---------- Orgs and repos ----------

message Org {
  string id = 1;
  string name = 2;
  string display = 3;
  google.protobuf.Timestamp created_at = 4;
  string description = 5;
  string avatar_url = 6;
  string website = 7;
  string email = 8;
  string location = 9;
  string enterprise_id = 10;
  uint64 version = 11;
  google.protobuf.Timestamp deleted_at = 12; // set while soft-deleted
  repeated string verified_domains = 13;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_MEMBER = 3;
  ROLE_BILLING_MANAGER = 4;
  ROLE_SECURITY_MANAGER = 5;
  ROLE_MODERATOR = 6;
  ROLE_APP_MANAGER = 7;
}

message Member {
  Principal principal = 1;
  Role role = 2;
  repeated string custom_role_ids = 3; // custom org roles (PolicyService)
  google.protobuf.Timestamp joined_at = 4;
  bool two_factor_enabled = 5;
  bool public_membership = 6;
}

message ListOrgsRequest {
  string principal_id = 1; // empty = caller
  PageRequest page = 2;
}

message ListOrgsResponse {
  repeated Org orgs = 1;
  PageResponse page = 2;
}

message UpdateOrgRequest {
  string org = 1;
  optional string display = 2;
  optional string description = 3;
  optional string website = 4;
  optional string email = 5;
  optional string location = 6;
  uint64 expected_version = 7;
}

message RenameOrgRequest {
  string org = 1;
  string new_name = 2;
}

message DeleteOrgRequest {
  string org = 1;
  string confirm_name = 2; // must equal the org name
}

message DeleteOrgResponse {
  google.protobuf.Timestamp restorable_until = 1;
}

message RestoreOrgRequest {
  string org_id = 1;
}

// Repo role names shared by orgs, teams and collaborators.
enum RepoRole {
  REPO_ROLE_UNSPECIFIED = 0;
  REPO_ROLE_NONE = 1;
  REPO_ROLE_READ = 2;
  REPO_ROLE_TRIAGE = 3;
  REPO_ROLE_WRITE = 4;
  REPO_ROLE_MAINTAIN = 5;
  REPO_ROLE_ADMIN = 6;
}

// Org-wide settings: base permissions and member privileges.
message OrgSettings {
  string org_id = 1;
  RepoRole base_repo_role = 2;              // what every member gets on every repo
  bool members_can_create_repos = 3;
  bool members_can_create_public_repos = 4;
  bool members_can_fork_private_repos = 5;
  bool members_can_delete_repos = 6;
  bool members_can_invite_outside_collaborators = 7;
  bool members_can_create_teams = 8;
  bool web_commit_signoff_required = 9;
  string readme_repo_id = 10;               // org profile README
  repeated string pinned_repo_ids = 11;
  uint32 max_open_changes_per_agent = 12;   // agent flood defense default (PRODUCT §4.21)
  uint64 version = 13;
}

message GetOrgSettingsRequest {
  string org = 1;
}

message UpdateOrgSettingsRequest {
  string org = 1;
  optional RepoRole base_repo_role = 2;
  optional bool members_can_create_repos = 3;
  optional bool members_can_create_public_repos = 4;
  optional bool members_can_fork_private_repos = 5;
  optional bool members_can_delete_repos = 6;
  optional bool members_can_invite_outside_collaborators = 7;
  optional bool members_can_create_teams = 8;
  optional bool web_commit_signoff_required = 9;
  optional string readme_repo_id = 10;
  repeated string pinned_repo_ids = 11;
  bool set_pinned_repo_ids = 12; // pinned_repo_ids replaces the list only when true
  optional uint32 max_open_changes_per_agent = 13;
  uint64 expected_version = 14;
}

// State of an invitation.
enum InvitationState {
  INVITATION_STATE_UNSPECIFIED = 0;
  INVITATION_STATE_PENDING = 1;
  INVITATION_STATE_ACCEPTED = 2;
  INVITATION_STATE_DECLINED = 3;
  INVITATION_STATE_CANCELLED = 4;
  INVITATION_STATE_EXPIRED = 5;
}

// An invitation to join an org.
message OrgInvitation {
  string id = 1;
  string org_id = 2;
  string invitee_login = 3;
  string invitee_email = 4;
  string invitee_principal_id = 5;
  Role role = 6;
  repeated string team_ids = 7;
  Principal inviter = 8;
  InvitationState state = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp expires_at = 11;
}

message CreateOrgInvitationRequest {
  string org = 1;
  string invitee_login = 2;      // one of login, email or principal id
  string invitee_email = 3;
  string invitee_principal_id = 4;
  Role role = 5;
  repeated string team_ids = 6;
}

message ListOrgInvitationsRequest {
  string org = 1;
  InvitationState state = 2;
  PageRequest page = 3;
}

message ListOrgInvitationsResponse {
  repeated OrgInvitation invitations = 1;
  PageResponse page = 2;
}

message CancelOrgInvitationRequest {
  string org = 1;
  string invitation_id = 2;
}

message CancelOrgInvitationResponse {}

message AcceptOrgInvitationRequest {
  string invitation_id = 1;
}

message DeclineOrgInvitationRequest {
  string invitation_id = 1;
}

message DeclineOrgInvitationResponse {}

message AssignOrgRoleRequest {
  string org = 1;
  string principal_id = 2;
  Role role = 3;            // built-in role, or
  string custom_role_id = 4; // a custom org role
}

message RevokeOrgRoleRequest {
  string org = 1;
  string principal_id = 2;
  string custom_role_id = 3;
}

message ListOutsideCollaboratorsRequest {
  string org = 1;
  PageRequest page = 2;
}

// A person with access to some repos of an org without being a member.
message OutsideCollaborator {
  Principal principal = 1;
  repeated string repo_ids = 2;
}

message ListOutsideCollaboratorsResponse {
  repeated OutsideCollaborator collaborators = 1;
  PageResponse page = 2;
}

message ConvertToOutsideCollaboratorRequest {
  string org = 1;
  string principal_id = 2;
}

message ConvertToOutsideCollaboratorResponse {
  OutsideCollaborator collaborator = 1;
}

message CreateOrgRequest {
  string name = 1;
  string display = 2;
}

message GetOrgRequest {
  string name_or_id = 1;
}

message ListMembersRequest {
  string org = 1;
  PageRequest page = 2;
}

message ListMembersResponse {
  repeated Member members = 1;
  PageResponse page = 2;
}

message SetMemberRequest {
  string org = 1;
  string principal_id = 2;
  Role role = 3; // ROLE_UNSPECIFIED removes the member
}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PRIVATE = 1;
  VISIBILITY_INTERNAL = 2;
  VISIBILITY_PUBLIC = 3;
}

message Repo {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string full_name = 4;
  Visibility visibility = 5;
  string default_ref = 6;
  string description = 7;
  google.protobuf.Timestamp created_at = 8;
  bool archived = 9;
  bool is_template = 10;
  string template_repo_id = 11;   // repo this one was created from
  string fork_parent_id = 12;     // set for forks
  repeated string topics = 13;
  string homepage = 14;
  string social_preview_url = 15;
  google.protobuf.Timestamp deleted_at = 16; // set while soft-deleted
  uint64 version = 17;
  repeated KeyValue custom_properties = 18;
  uint64 size_bytes = 19;
  google.protobuf.Timestamp pushed_at = 20;  // last ref update
  uint64 stars = 21;
  uint64 forks = 22;
  uint64 open_issues = 23;
  uint64 open_changes = 24;
  string license_spdx = 25;       // detected license
  string primary_language = 26;
}

// Per-repo settings (SPEC §11.1).
message RepoSettings {
  string repo_id = 1;
  repeated LandMethod allowed_land_methods = 2;
  LandMethod default_land_method = 3;
  string squash_message_template = 4;    // "title", "title_and_body", "changesets"
  bool allow_auto_merge = 5;
  bool merge_queue_required = 6;
  bool suggest_update_base = 7;          // show "update base" when a CR is behind
  bool delete_workspace_ref_on_land = 8;
  bool has_issues = 9;
  bool has_projects = 10;
  bool has_wiki = 11;
  bool has_discussions = 12;
  bool allow_forking = 13;
  bool web_commit_signoff_required = 14;
  uint32 draft_retention_days = 15;      // SPEC §6.4, default 30
  uint32 cold_after_days = 16;           // SPEC §6.5, default 90
  bool push_auto_change = 17;            // a pushed new branch opens a CR (SPEC §17.4)
  bool git_enabled = 18;                 // serve git smart HTTP/SSH
  uint32 land_attempt_budget = 19;       // SPEC §7.4; 0 = default
  bool auto_revert = 20;                 // land revert CRs for failed post-land checks
  uint64 version = 21;
  // The merge queue tests the combined result before landing (SPEC §11.6): the head entry is
  // rebased onto the target tip, required checks run on that speculative changeset
  // (`merge_group`), and only a passing result lands; a failing entry is ejected.
  bool merge_queue_check_combined = 22;
}

message CreateRepoRequest {
  string org = 1;
  string name = 2;
  Visibility visibility = 3;
  string description = 4;
  bool is_template = 5;
  repeated string topics = 6;
  string homepage = 7;
  bool auto_init = 8;     // add a README in the root changeset
  string license_template = 9; // SPDX id of a license file to add
}

message GetRepoRequest {
  RepoRef repo = 1;
}

message ListReposRequest {
  string org = 1;
  PageRequest page = 2;
}

message ListReposResponse {
  repeated Repo repos = 1;
  PageResponse page = 2;
}

message UpdateRepoRequest {
  RepoRef repo = 1;
  string name = 2;        // rename; empty = unchanged
  Visibility visibility = 3;
  string description = 4;
  optional string homepage = 5;
  optional string default_ref = 6;
  optional bool is_template = 7;
  uint64 expected_version = 8;
}

message DeleteRepoRequest {
  RepoRef repo = 1;
  string confirm_full_name = 2; // must equal "org/name"
}

message DeleteRepoResponse {
  google.protobuf.Timestamp restorable_until = 1;
}

message RestoreRepoRequest {
  string repo_id = 1;
}

message ListDeletedReposRequest {
  string org = 1;
  PageRequest page = 2;
}

message ListDeletedReposResponse {
  repeated Repo repos = 1;
  PageResponse page = 2;
}

message ArchiveRepoRequest {
  RepoRef repo = 1;
}

message UnarchiveRepoRequest {
  RepoRef repo = 1;
}

message TransferRepoRequest {
  RepoRef repo = 1;
  string new_org = 2;
  string new_name = 3;          // empty = keep the name
  repeated string team_ids = 4; // teams in the new org that get access
}

message CreateRepoFromTemplateRequest {
  RepoRef template = 1;
  string org = 2;
  string name = 3;
