  string name = 1;
  bytes path = 2;
  string body = 3;
}

message ListChangeTemplatesResponse {
  repeated ChangeTemplate templates = 1;
}

message LandChangeRequest {
  RepoRef repo = 1;
  string id = 2;
  LandMethod method = 3;
  string message = 4;
  uint32 expected_revision = 5; // 0 = any; else fails with VERSION_MISMATCH when stale
}

message LandChangeResponse {
  ChangeRequest change = 1;
  LandResponse land = 2;
}

message EnableAutoMergeRequest {
  RepoRef repo = 1;
  string id = 2;
  LandMethod method = 3;
  string message = 4;
}

message DisableAutoMergeRequest {
  RepoRef repo = 1;
  string id = 2;
}

message EnqueueChangeRequest {
  RepoRef repo = 1;
  string id = 2;
  LandMethod method = 3;
  uint32 priority = 4; // needs the merge-queue jump permission above 0
}

message DequeueChangeRequest {
  RepoRef repo = 1;
  string id = 2;
}

message DequeueChangeResponse {}

message GetMergeQueueRequest {
  RepoRef repo = 1;
  string ref = 2;
}

message GetMergeQueueResponse {
  repeated MergeQueueEntry entries = 1;
  uint32 lands_per_minute = 2; // recent throughput
}

message RevertChangeRequest {
  RepoRef repo = 1;
  string id = 2;    // the landed CR
  string title = 3; // empty = "Revert <title>"
  string body = 4;
  bool draft = 5;
}

message UpdateChangeBaseRequest {
  RepoRef repo = 1;
  string id = 2;
  LandMethod method = 3; // REBASE (default) or MERGE_COMMIT
}

message ListChangeStackRequest {
  RepoRef repo = 1;
  string id = 2; // any CR in the stack
}

message ListChangeStackResponse {
  repeated ChangeRequest changes = 1; // bottom first
}

message SetChangeSummaryRequest {
  RepoRef repo = 1;
  string id = 2;
  string summary = 3;
}

message CreateChangesetCommentRequest {
  RepoRef repo = 1;
  ObjectId changeset = 2;
  string body = 3;
  bytes path = 4;     // optional anchor
  uint32 line = 5;
}

message ListChangesetCommentsRequest {
  RepoRef repo = 1;
  ObjectId changeset = 2;
  PageRequest page = 3;
}

message ListChangesetCommentsResponse {
  repeated Comment comments = 1;
  PageResponse page = 2;
}

// State of a conflict waiting for a resolver.
enum LandConflictState {
  LAND_CONFLICT_STATE_UNSPECIFIED = 0;
  LAND_CONFLICT_STATE_OPEN = 1;
  LAND_CONFLICT_STATE_RESOLUTION_SUBMITTED = 2;
  LAND_CONFLICT_STATE_RESOLVED = 3;   // the resolution landed
  LAND_CONFLICT_STATE_ABANDONED = 4;
}

// A conflict from a land, rebase or merge queue run, held for a resolver (SPEC §11.6).
message LandConflict {
  string id = 1;
  string repo_id = 2;
  string change_request_id = 3;
  string ref = 4;
  ConflictSet conflicts = 5;
  LandConflictState state = 6;
  ObjectId resolution = 7;
  Principal resolver = 8;
  google.protobuf.Timestamp created_at = 9;
  string error_reason = 10; // set when a submitted resolution was refused
}

message GetLandConflictRequest {
  RepoRef repo = 1;
  string id = 2;
}

message ListLandConflictsRequest {
  RepoRef repo = 1;
  LandConflictState state = 2;
  PageRequest page = 3;
}

message ListLandConflictsResponse {
  repeated LandConflict conflicts = 1;
  PageResponse page = 2;
}

message SubmitConflictResolutionRequest {
  RepoRef repo = 1;
  string id = 2;
  ObjectId resolution = 3; // a changeset whose parents are ours and theirs, or a rebased head
  bool land = 4;           // land it once policy allows
}

// ---------- Checks ----------

enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_QUEUED = 1;
  CHECK_STATUS_RUNNING = 2;
  CHECK_STATUS_PASSED = 3;
  CHECK_STATUS_FAILED = 4;
  CHECK_STATUS_SKIPPED = 5;
  CHECK_STATUS_CANCELLED = 6;
  CHECK_STATUS_TIMED_OUT = 7;
  CHECK_STATUS_NEUTRAL = 8;
  CHECK_STATUS_ACTION_REQUIRED = 9;
  CHECK_STATUS_STALE = 10;
}

// Severity of a check annotation.
enum AnnotationLevel {
  ANNOTATION_LEVEL_UNSPECIFIED = 0;
  ANNOTATION_LEVEL_NOTICE = 1;
  ANNOTATION_LEVEL_WARNING = 2;
  ANNOTATION_LEVEL_FAILURE = 3;
}

// A finding attached to a line range of a file.
message CheckAnnotation {
  bytes path = 1;
  uint32 start_line = 2;
  uint32 end_line = 3;
  uint32 start_column = 4;
  uint32 end_column = 5;
  AnnotationLevel level = 6;
  string message = 7;
  string title = 8;
  string raw_details = 9;
}

// An image shown in a check's output.
message CheckImage {
  string alt = 1;
  string image_url = 2;
  string caption = 3;
}

// Rich output of a check run (Markdown).
message CheckOutput {
  string title = 1;
  string summary = 2;
  string text = 3;
  repeated CheckAnnotation annotations = 4; // appended on each report, up to the limit
  repeated CheckImage images = 5;
}

// A button the reporter offers on a check run; pressing it sends a `check_run.requested_action` event.
message CheckAction {
  string label = 1;
  string description = 2;
  string identifier = 3;
}

message CheckRun {
  string id = 1;
  string repo_id = 2;
  ObjectId changeset = 3;
  string name = 4;
  CheckStatus status = 5;
  string url = 6;
  string summary = 7;
  bool post_land = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  string external_id = 11;
  CheckOutput output = 12;
  string suite_id = 13;
  Principal reporter = 14;      // app, workflow or agent that reported it
  repeated CheckAction actions = 15;
  uint32 annotations_count = 16;
  string workflow_job_id = 17;  // set when a Beehive workflow job produced it
}

message ReportCheckRequest {
  RepoRef repo = 1;
  ObjectId changeset = 2;
  string name = 3;
  CheckStatus status = 4;
  string url = 5;
  string summary = 6;
  bool post_land = 7;
  string external_id = 8;
  CheckOutput output = 9;
  string suite_id = 10;
  repeated CheckAction actions = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp finished_at = 13;
}

message ListChecksRequest {
  RepoRef repo = 1;
  ObjectId changeset = 2;
  string name = 3;      // filter by check name
  string suite_id = 4;
  bool latest_only = 5; // only the newest run per name
}

message ListChecksResponse {
  repeated CheckRun checks = 1;
}

message GetCheckRunRequest {
  RepoRef repo = 1;
  string id = 2;
}

message UpdateCheckRunRequest {
  RepoRef repo = 1;
  string id = 2;
  optional CheckStatus status = 3;
  optional string url = 4;
  optional string summary = 5;
  CheckOutput output = 6;   // annotations are appended; other fields replace when set
  repeated CheckAction actions = 7;
  google.protobuf.Timestamp finished_at = 8;
}

message ListCheckAnnotationsRequest {
  RepoRef repo = 1;
  string check_run_id = 2;
  PageRequest page = 3;
}

message ListCheckAnnotationsResponse {
  repeated CheckAnnotation annotations = 1;
  PageResponse page = 2;
}

message RerequestCheckRunRequest {
  RepoRef repo = 1;
  string id = 2;
}

// Checks reported by one app or workflow for one changeset.
message CheckSuite {
  string id = 1;
  string repo_id = 2;
  ObjectId changeset = 3;
  string app_id = 4;
  CheckStatus status = 5;    // aggregate of its runs
  string head_ref = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  uint32 runs_count = 9;
}

message CreateCheckSuiteRequest {
  RepoRef repo = 1;
  ObjectId changeset = 2;
  string head_ref = 3;
}

message ListCheckSuitesRequest {
  RepoRef repo = 1;
  ObjectId changeset = 2;
  string app_id = 3;
}

message ListCheckSuitesResponse {
  repeated CheckSuite suites = 1;
}

message RerequestCheckSuiteRequest {
  RepoRef repo = 1;
  string id = 2;
}

// State of a legacy commit status.
enum CommitStatusState {
  COMMIT_STATUS_STATE_UNSPECIFIED = 0;
  COMMIT_STATUS_STATE_PENDING = 1;
  COMMIT_STATUS_STATE_SUCCESS = 2;
  COMMIT_STATUS_STATE_FAILURE = 3;
  COMMIT_STATUS_STATE_ERROR = 4;
}

// A legacy commit status (GitHub's statuses API), mapped onto a check run.
message CommitStatus {
  string id = 1;
  ObjectId changeset = 2;
  string context = 3;
  CommitStatusState state = 4;
  string target_url = 5;
  string description = 6;
  Principal creator = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateCommitStatusRequest {
  RepoRef repo = 1;
  ObjectId changeset = 2;
  string context = 3;
  CommitStatusState state = 4;
  string target_url = 5;
  string description = 6;
}

message ListCommitStatusesRequest {
  RepoRef repo = 1;
  ObjectId changeset = 2;
  PageRequest page = 3;
}

message ListCommitStatusesResponse {
  repeated CommitStatus statuses = 1;
  PageResponse page = 2;
}

message GetCombinedStatusRequest {
  RepoRef repo = 1;
  Revision at = 2;
}

// The latest status per context and their combination.
message CombinedStatus {
  ObjectId changeset = 1;
  CommitStatusState state = 2;
  repeated CommitStatus statuses = 3;
}

// State of a bisect.
enum BisectState {
  BISECT_STATE_UNSPECIFIED = 0;
  BISECT_STATE_RUNNING = 1;
  BISECT_STATE_FOUND = 2;     // first failing changeset identified
  BISECT_STATE_INCONCLUSIVE = 3;
  BISECT_STATE_CANCELLED = 4;
  BISECT_STATE_FLAKY = 5;     // the failing check passed when re-run at the failing changeset
}

// A bisect of a landed range for a failing post-land check (SPEC §11.6).
message Bisect {
  string id = 1;
  string repo_id = 2;
  string ref = 3;
  string check_name = 4;
  ObjectId good = 5;
  ObjectId bad = 6;
  BisectState state = 7;
  ObjectId first_bad = 8;
  repeated ObjectId tested = 9;
  string revert_change_request_id = 10; // revert CR opened (or landed) for first_bad
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
}

message StartBisectRequest {
  RepoRef repo = 1;
  string ref = 2;
  string check_name = 3;
  ObjectId good = 4;  // empty = the last changeset where the check passed
  ObjectId bad = 5;   // empty = the ref tip
  bool open_revert = 6;
  bool manual = 7;    // driven by MarkBisect instead of CI probes
}

message GetBisectRequest {
  RepoRef repo = 1;
  string id = 2;
}

message ListBisectsRequest {
  RepoRef repo = 1;
  BisectState state = 2;
  PageRequest page = 3;
}

message ListBisectsResponse {
  repeated Bisect bisects = 1;
  PageResponse page = 2;
}

// ---------- Leases ----------

enum LeaseMode {
  LEASE_MODE_UNSPECIFIED = 0;
  LEASE_MODE_ADVISORY = 1;
  LEASE_MODE_EXCLUSIVE = 2;
}

message Lease {
  string id = 1;
  string repo_id = 2;
  string ref = 3;
  repeated bytes paths = 4;
  Principal holder = 5;
  ChangeId change_id = 6;
  LeaseMode mode = 7;
  google.protobuf.Timestamp expires_at = 8;
  string note = 9;
}

message AcquireLeaseRequest {
  RepoRef repo = 1;
  string ref = 2;
  repeated bytes paths = 3;
  LeaseMode mode = 4;
  uint32 ttl_seconds = 5; // 0 = default (2 hours)
  ChangeId change_id = 6;
  string note = 7;
}

message AcquireLeaseResponse {
  Lease lease = 1;
  repeated Lease overlapping = 2; // advisory overlaps the caller should know about
}

message RenewLeaseRequest {
  RepoRef repo = 1;
  string id = 2;
  uint32 ttl_seconds = 3;
}

message ReleaseLeaseRequest {
  RepoRef repo = 1;
  string id = 2;
}

message ReleaseLeaseResponse {}

message ListLeasesRequest {
  RepoRef repo = 1;
  repeated bytes paths = 2; // filter: leases overlapping these paths
  // List leases across every repo of this org (gap G10); repo may then be empty.
  string org = 3;
}

message ListLeasesResponse {
  repeated Lease leases = 1;
}

message GetLeaseRequest {
  RepoRef repo = 1;
  string id = 2;
}

// ---------- Events ----------

message Event {
  uint64 seq = 1;
  string repo_id = 2;
  string kind = 3; // e.g. "ref.updated", "lease.acquired"
  google.protobuf.Timestamp time = 4;
  string principal = 5;
  oneof body {
    Ref ref_updated = 10;
    ChangeRequest change = 11;
    Review review = 12;
    CheckRun check = 13;
    Lease lease = 14;
    string policy_epoch = 15;
    string revoked_token = 16;
    Post post = 17;                 // "post.*" events
  }
  // Every event names its subject. Events of areas without a typed body above (issues,
  // discussions, workflows, releases, ...) carry the subject's resource as proto3-JSON in
  // `payload_json`, for example kind "issue.opened" with a bee.v1.Issue.
  SubjectRef subject = 20;
  string payload_json = 21;
  string org_id = 22;
  repeated string on_behalf_of = 23; // delegation chain of `principal`
}

message SubscribeRequest {
  RepoRef repo = 1;
  uint64 from_seq = 2;
  repeated string kinds = 3; // empty = all; a trailing ".*" matches a prefix, e.g. "cr.*"
  string org = 4;            // subscribe to an org's log instead of one repo's
}

// Payload format of webhook deliveries.
enum WebhookFormat {
  WEBHOOK_FORMAT_UNSPECIFIED = 0; // same as BEE
  WEBHOOK_FORMAT_BEE = 1;       // bee.v1.Event as proto3-JSON
  WEBHOOK_FORMAT_GITHUB = 2;      // GitHub-compatible payloads and X-GitHub-Event headers
}

message Webhook {
  string id = 1;
  string repo_id = 2;
  string url = 3;
  repeated string kinds = 4;
  string org_id = 5;   // set for org-level webhooks
  string app_id = 6;   // set for app-level webhooks
  WebhookFormat format = 7;
  bool active = 8;
  google.protobuf.Timestamp created_at = 9;
  WebhookDelivery last_delivery = 10;
  bool insecure_ssl = 11;
}

message CreateWebhookRequest {
  RepoRef repo = 1;
  string url = 2;
  repeated string kinds = 3;
  string secret = 4; // HMAC key; write-only
  string org = 5;    // create an org-level webhook instead of a repo one
  WebhookFormat format = 6;
  bool inactive = 7; // create disabled
  bool insecure_ssl = 8;
}

message DeleteWebhookRequest {
  RepoRef repo = 1;
  string id = 2;
  string org = 3;
}

message DeleteWebhookResponse {}

message ListWebhooksRequest {
  RepoRef repo = 1;
  string org = 2;
  PageRequest page = 3;
}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
  PageResponse page = 2;
}

message GetWebhookRequest {
  RepoRef repo = 1;
  string id = 2;
  string org = 3;
}

message UpdateWebhookRequest {
  RepoRef repo = 1;
  string id = 2;
  string org = 3;
  optional string url = 4;
  repeated string kinds = 5;
  bool set_kinds = 6;            // kinds replaces the list only when true
  optional string secret = 7;
  optional WebhookFormat format = 8;
  optional bool active = 9;
  optional bool insecure_ssl = 10;
}

message PingWebhookRequest {
  RepoRef repo = 1;
  string id = 2;
  string org = 3;
}

// One delivery attempt of an event to a webhook.
message WebhookDelivery {
  string id = 1;
  string webhook_id = 2;
  uint64 event_seq = 3;
  string event_kind = 4;
  google.protobuf.Timestamp delivered_at = 5;
  uint32 status_code = 6;     // HTTP status from the receiver; 0 when unreachable
  uint32 duration_ms = 7;
  bool success = 8;
  bool redelivery = 9;
  uint32 attempt = 10;
  string request_headers_json = 11;  // only in GetWebhookDelivery
  string request_body = 12;          // only in GetWebhookDelivery
  string response_headers_json = 13; // only in GetWebhookDelivery
  string response_body = 14;         // only in GetWebhookDelivery, truncated
  string error = 15;
}

message ListWebhookDeliveriesRequest {
  RepoRef repo = 1;
  string webhook_id = 2;
  string org = 3;
  optional bool success = 4;
  PageRequest page = 5;
}

message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
  PageResponse page = 2;
}

message GetWebhookDeliveryRequest {
  RepoRef repo = 1;
  string webhook_id = 2;
  string delivery_id = 3;
  string org = 4;
}

message RedeliverWebhookRequest {
  RepoRef repo = 1;
  string webhook_id = 2;
  string delivery_id = 3;
  string org = 4;
}

message ListEventsRequest {
  RepoRef repo = 1;
  string org = 2;
  uint64 from_seq = 3;
  repeated string kinds = 4;
  uint32 limit = 5; // 0 = server default
}

message ListEventsResponse {
  repeated Event events = 1;
  uint64 next_seq = 2; // pass as from_seq to continue
}

message GetEventLogInfoRequest {
  RepoRef repo = 1;
  string org = 2;
}

// Retention window of an event log.
message EventLogInfo {
  uint64 oldest_seq = 1;
  uint64 latest_seq = 2;
  uint32 retention_days = 3;
}

// Request for AddChangeReaction.
message AddChangeReactionRequest {
  RepoRef repo = 1;
  string change_request_id = 2;
  string comment_id = 3;      // empty = the change request itself
  ReactionContent content = 4;
}

// Request for RemoveChangeReaction.
message RemoveChangeReactionRequest {
  RepoRef repo = 1;
  string change_request_id = 2;
  string comment_id = 3;      // empty = the change request itself
  ReactionContent content = 4;
}

// The reactions of the subject after the change.
message ChangeReactionResponse {
  repeated ReactionGroup reactions = 1;
}

// Request for SetChangeLocked.
message SetChangeLockedRequest {
  RepoRef repo = 1;
  string change_request_id = 2;
  bool locked = 3;
}

// Request for GetBisectSession.
message GetBisectSessionRequest {
  RepoRef repo = 1;
  string id = 2;
}

// A manual mark or a probe's result.
enum BisectOutcome {
  BISECT_OUTCOME_UNSPECIFIED = 0; // still running (probes)
  BISECT_OUTCOME_GOOD = 1;        // the check passed: the culprit is later
  BISECT_OUTCOME_BAD = 2;         // the check failed: the culprit is this or earlier
  BISECT_OUTCOME_SKIP = 3;        // could not be tested
}

// One probe or mark of a session.
message BisectProbe {
  ObjectId changeset = 1;
  BisectOutcome outcome = 2;
  uint32 round = 3;     // 0 = history or a mark
  string probe_id = 4;  // the prober's handle (a workflow run id for CI probes)
  string source = 5;    // "probe", "history" or the principal that marked it
}

// A bisect session in full.
message BisectSession {
  Bisect bisect = 1;
  repeated ObjectId candidates = 2; // oldest first; the last is the failing changeset
  repeated BisectProbe probes = 3;
  uint32 rounds = 4;
  string mode = 5;                  // "auto" or "manual"
  string note = 6;                  // why it ended as it did, and what happened to the revert
  string culprit_change_request_id = 7;
  string culprit_author = 8;
  bool revert_landed = 9;
  string failing_url = 10;
}

// Request for GetBisectNextCandidate.
message GetBisectNextCandidateRequest {
  RepoRef repo = 1;
  string id = 2;
}

// Response for GetBisectNextCandidate.
message GetBisectNextCandidateResponse {
  ObjectId changeset = 1; // unset once the session is decided or finished
}

// Request for MarkBisect.
message MarkBisectRequest {
  RepoRef repo = 1;
  string id = 2;
  ObjectId changeset = 3;
  BisectOutcome outcome = 4;
}

// Request for CancelBisect.
message CancelBisectRequest {
  RepoRef repo = 1;
  string id = 2;
}
