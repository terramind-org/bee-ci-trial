// Beehive secrets and variables for bee.v1 (PRODUCT §4.14 build services).
// Secrets are sealed by the client with the scope's public key and are never readable back
// through the API; variables are plain values and are readable by anyone who may list them.
syntax = "proto3";

package bee.v1;

import "google/protobuf/timestamp.proto";
import "bee/v1/common.proto";

// Encrypted secrets and plain variables for workflows, environments, workspaces and agents.
service SecretService {
  // Returns the public key that new secret values for a scope must be sealed with.
  // Errors: NOT_FOUND, PERMISSION_DENIED.
  rpc GetSecretPublicKey(GetSecretPublicKeyRequest) returns (SecretPublicKey);
  // Creates or replaces a secret. The value is a sealed box made with the scope's public key.
  // Errors: INVALID_ARGUMENT (subcode `stale_key_id` when key_id is not current, `bad_ciphertext`),
  // TOO_LARGE (value over the limit), QUOTA_EXCEEDED (too many secrets in the scope).
  rpc PutSecret(PutSecretRequest) returns (Secret);
  // Returns one secret's metadata; never the value. Errors: NOT_FOUND.
  rpc GetSecret(GetSecretRequest) returns (Secret);
  // Lists secret metadata in a scope; never values.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // Lists the org secrets a repo can use, given each secret's visibility.
  rpc ListRepoOrgSecrets(ListRepoOrgSecretsRequest) returns (ListRepoOrgSecretsResponse);
  // Deletes a secret. Errors: NOT_FOUND.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // Lists the repos selected for an org or workspace-user secret with SELECTED visibility.
  rpc ListSecretSelectedRepos(ListSecretSelectedReposRequest) returns (ListSecretSelectedReposResponse);
  // Replaces the selected repo set of a secret. Errors: INVALID_STATE (visibility not SELECTED).
  rpc SetSecretSelectedRepos(SetSecretSelectedReposRequest) returns (SetSecretSelectedReposResponse);
  // Adds one repo to a secret's selected set. Errors: INVALID_STATE (visibility not SELECTED).
  rpc AddSecretSelectedRepo(AddSecretSelectedRepoRequest) returns (AddSecretSelectedRepoResponse);
  // Removes one repo from a secret's selected set.
  rpc RemoveSecretSelectedRepo(RemoveSecretSelectedRepoRequest) returns (RemoveSecretSelectedRepoResponse);
  // Creates a variable. Errors: ALREADY_EXISTS, TOO_LARGE, QUOTA_EXCEEDED.
  rpc CreateVariable(CreateVariableRequest) returns (Variable);
  // Returns one variable with its value. Errors: NOT_FOUND.
  rpc GetVariable(GetVariableRequest) returns (Variable);
  // Lists variables in a scope with their values.
  rpc ListVariables(ListVariablesRequest) returns (ListVariablesResponse);
  // Updates a variable's value, name or visibility. Errors: NOT_FOUND, ALREADY_EXISTS (rename).
  rpc UpdateVariable(UpdateVariableRequest) returns (Variable);
  // Deletes a variable. Errors: NOT_FOUND.
  rpc DeleteVariable(DeleteVariableRequest) returns (DeleteVariableResponse);
  // Lists the repos selected for an org variable with SELECTED visibility.
  rpc ListVariableSelectedRepos(ListVariableSelectedReposRequest) returns (ListVariableSelectedReposResponse);
  // Replaces the selected repo set of an org variable. Errors: INVALID_STATE.
  rpc SetVariableSelectedRepos(SetVariableSelectedReposRequest) returns (SetVariableSelectedReposResponse);
}

// ---------- Scopes ----------

// Where a secret or variable lives.
enum SecretScopeKind {
  SECRET_SCOPE_KIND_UNSPECIFIED = 0;
  SECRET_SCOPE_KIND_ORG = 1;            // org-wide, filtered by visibility
  SECRET_SCOPE_KIND_REPO = 2;
  SECRET_SCOPE_KIND_ENVIRONMENT = 3;    // a deployment environment of a repo
  SECRET_SCOPE_KIND_WORKSPACE_USER = 4; // a user's own secrets for cloud workspaces
  SECRET_SCOPE_KIND_AGENT = 5;          // secrets injected into one agent principal's runs
}

// Names a secret or variable scope. Fill the fields the kind needs: ORG uses `org`; REPO uses
// `repo`; ENVIRONMENT uses `repo` and `environment`; WORKSPACE_USER and AGENT use
// `principal_id` (and `org` when the agent is org-owned).
message SecretScope {
  SecretScopeKind kind = 1;
  string org = 2;          // org name or id
  RepoRef repo = 3;
  string environment = 4;  // environment name
  string principal_id = 5; // user or agent ULID
}

// Which repos can read an org-level (or workspace-user) secret or variable.
enum SecretVisibility {
  SECRET_VISIBILITY_UNSPECIFIED = 0; // not applicable (repo, environment, agent scopes)
  SECRET_VISIBILITY_ALL = 1;         // every repo in the org
  SECRET_VISIBILITY_PRIVATE = 2;     // private and internal repos only
  SECRET_VISIBILITY_SELECTED = 3;    // only the selected repo set
}

// ---------- Resources ----------

// The public key for sealing secret values in a scope (libsodium sealed box, X25519).
message SecretPublicKey {
  SecretScope scope = 1;
  string key_id = 2; // pass back in PutSecret so the server knows which private key to use
  bytes key = 3;     // 32-byte X25519 public key
  google.protobuf.Timestamp created_at = 4;
}

// Secret metadata. The value is never returned by any RPC.
message Secret {
  string name = 1; // upper snake case, unique within the scope
  SecretScope scope = 2;
  SecretVisibility visibility = 3;
  uint32 selected_repo_count = 4; // when visibility is SELECTED
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  Principal updated_by = 7;
}

// A plain configuration variable; its value is readable.
message Variable {
  string name = 1;
  string value = 2;
  SecretScope scope = 3;
  SecretVisibility visibility = 4;
  uint32 selected_repo_count = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  Principal updated_by = 8;
}

// ---------- Secret requests ----------

// Request for GetSecretPublicKey.
message GetSecretPublicKeyRequest {
  SecretScope scope = 1;
}

// Request for PutSecret.
message PutSecretRequest {
  SecretScope scope = 1;
  string name = 2;
  bytes encrypted_value = 3; // sealed box of the UTF-8 value
  string key_id = 4;         // from GetSecretPublicKey
  SecretVisibility visibility = 5;     // org and workspace-user scopes only
  repeated RepoRef selected_repos = 6; // with visibility SELECTED
}

// Request for GetSecret.
message GetSecretRequest {
  SecretScope scope = 1;
  string name = 2;
}

// Request for ListSecrets.
message ListSecretsRequest {
  SecretScope scope = 1;
  PageRequest page = 2;
}

// Response for ListSecrets.
message ListSecretsResponse {
  repeated Secret secrets = 1;
  PageResponse page = 2;
}

// Request for ListRepoOrgSecrets.
message ListRepoOrgSecretsRequest {
  RepoRef repo = 1;
  PageRequest page = 2;
}

// Response for ListRepoOrgSecrets.
message ListRepoOrgSecretsResponse {
  repeated Secret secrets = 1;
  PageResponse page = 2;
}

// Request for DeleteSecret.
message DeleteSecretRequest {
  SecretScope scope = 1;
  string name = 2;
}

// Response for DeleteSecret.
message DeleteSecretResponse {}

// Request for ListSecretSelectedRepos.
message ListSecretSelectedReposRequest {
  SecretScope scope = 1;
  string name = 2;
  PageRequest page = 3;
}

// Response for ListSecretSelectedRepos.
message ListSecretSelectedReposResponse {
  repeated RepoRef repos = 1;
  PageResponse page = 2;
}

// Request for SetSecretSelectedRepos.
message SetSecretSelectedReposRequest {
  SecretScope scope = 1;
  string name = 2;
  repeated RepoRef repos = 3;
}

// Response for SetSecretSelectedRepos.
message SetSecretSelectedReposResponse {}

// Request for AddSecretSelectedRepo.
message AddSecretSelectedRepoRequest {
  SecretScope scope = 1;
  string name = 2;
  RepoRef selected_repo = 3;
}

// Response for AddSecretSelectedRepo.
message AddSecretSelectedRepoResponse {}

// Request for RemoveSecretSelectedRepo.
message RemoveSecretSelectedRepoRequest {
  SecretScope scope = 1;
  string name = 2;
  RepoRef selected_repo = 3;
}

// Response for RemoveSecretSelectedRepo.
message RemoveSecretSelectedRepoResponse {}

// ---------- Variable requests ----------

// Request for CreateVariable.
message CreateVariableRequest {
  SecretScope scope = 1;
  string name = 2;
  string value = 3;
  SecretVisibility visibility = 4;     // org scope only
  repeated RepoRef selected_repos = 5; // with visibility SELECTED
}

// Request for GetVariable.
message GetVariableRequest {
  SecretScope scope = 1;
  string name = 2;
}

// Request for ListVariables.
message ListVariablesRequest {
  SecretScope scope = 1;
  PageRequest page = 2;
}

// Response for ListVariables.
message ListVariablesResponse {
  repeated Variable variables = 1;
  PageResponse page = 2;
}

// Request for UpdateVariable.
message UpdateVariableRequest {
  SecretScope scope = 1;
  string name = 2;
  optional string new_name = 3;
  optional string value = 4;
  optional SecretVisibility visibility = 5;
}

// Request for DeleteVariable.
message DeleteVariableRequest {
  SecretScope scope = 1;
  string name = 2;
}

// Response for DeleteVariable.
message DeleteVariableResponse {}

// Request for ListVariableSelectedRepos.
message ListVariableSelectedReposRequest {
  SecretScope scope = 1;
  string name = 2;
  PageRequest page = 3;
}

// Response for ListVariableSelectedRepos.
message ListVariableSelectedReposResponse {
  repeated RepoRef repos = 1;
  PageResponse page = 2;
}

// Request for SetVariableSelectedRepos.
message SetVariableSelectedReposRequest {
  SecretScope scope = 1;
  string name = 2;
  repeated RepoRef repos = 3;
}

// Response for SetVariableSelectedRepos.
message SetVariableSelectedReposResponse {}
